        /* ===== 復習完了時の「衝撃」演出 =====
           以前はカード全体を左右にガタつかせる shake 演出だったが、安っぽく見えるとの
           フィードバックを受け、位置・回転を一切動かさない「発光パルス」のみに変更した。
           transform（位置/回転/拡大）は使わず、box-shadow の明滅だけで達成感を出す。 */
        @keyframes cardImpactGlow {
            0%   { box-shadow: 0 0 0 0 rgba(129,140,248,0); }
            30%  { box-shadow: 0 0 0 3px rgba(129,140,248,0.35), 0 0 24px 4px rgba(129,140,248,0.28); }
            100% { box-shadow: 0 0 0 0 rgba(129,140,248,0); }
        }
        .card-impact-glow { animation: cardImpactGlow 0.6s ease-out both; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; transform: translateY(-4px) scale(1.08); }
            100% { transform: translateY(-42px) scale(1); opacity: 0; }
        }
        .recover-popup {
            position: absolute; top: 10px; right: 16px; font-family: 'Inter', -apple-system, sans-serif; font-weight: 900;
            font-size: 1.05rem; color: #a5b4fc; text-shadow: 0 0 14px rgba(129,140,248,0.9);
            animation: floatUp 1.1s ease-out forwards; pointer-events: none; z-index: 30;
        }
        @keyframes flamePulse { 0%,100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
        .flame-pulse { animation: flamePulse 1.6s ease-in-out infinite; }

        /* ===== ランクバッジ 発光オーラ＋グラデーションアニメーション ===== */
        /* 低ランクほど控えめ（振れ幅が小さく、周期がゆっくり）、高ランクほど華やか（振れ幅が大きく、周期が速い） */
        @keyframes gradientDrift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes auraGlowPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        @keyframes auraGlowPulseRainbow { 0% { filter: brightness(1.1) hue-rotate(0deg); } 50% { filter: brightness(1.35) hue-rotate(180deg); } 100% { filter: brightness(1.1) hue-rotate(360deg); } }
        @keyframes rainbowShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .rank-badge { background-size: 260% 100%; transition: filter .3s ease; }

        .rank-e {
            background-image: linear-gradient(120deg, rgba(100,116,139,0.14), rgba(148,163,184,0.24), rgba(100,116,139,0.14));

            animation: gradientDrift 11s ease-in-out infinite;
        }
        .rank-d {

            color: #34d399; border-color: rgba(52,211,153,0.32);
            box-shadow: 0 0 4px 0px rgba(52,211,153,0.3);
            animation: gradientDrift 9.5s ease-in-out infinite;
        }
        .rank-c {
            background-image: linear-gradient(120deg, rgba(14,165,233,0.15), rgba(56,189,248,0.3), rgba(14,165,233,0.15));
            color: #38bdf8; border-color: rgba(56,189,248,0.38);

        .rank-b {

            color: #818cf8; border-color: rgba(129,140,248,0.42);
            box-shadow: 0 0 10px 1.5px rgba(129,140,248,0.45);

        .rank-a {

        /* SS: Sより一段上の「金」— より白く輝くゴールドで、Sより速く強い輝き */

        /* ===== 「合計回復」カウントアップ演出 ===== */

        @keyframes perfectShine { 0% { background-position: 0% 50%; } 50% { background-position: 220% 50%; } 100% { background-position: 0% 50%; } }

        /* ===== 復習ボタン 長押し（ホールド）演出 =====
           以前は holdProgress >= 50% でボタンを小刻みに震わせていたが、安っぽく見えるため廃止。
           代わりに charge が進むほど内側の光がじわっと強まる、上品な発光の高まりだけで力の高まりを表現する。 */
        @keyframes holdGlowPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
            50% { box-shadow: inset 0 0 18px 2px rgba(255,255,255,0.22); }
        }
        .hold-glow { animation: holdGlowPulse 0.85s ease-in-out infinite; }
        .hold-progress-fill { position: absolute; inset: 0; background: rgba(255,255,255,0.28); transform-origin: left center; pointer-events: none; }

        /* ===== ランクバッジ フリップ演出（回転して新ランクへ切り替え） ===== */
        @keyframes rankFlip {
            0% { transform: perspective(240px) rotateY(0deg); }
            45% { transform: perspective(240px) rotateY(90deg); }
            55% { transform: perspective(240px) rotateY(90deg); }
            100% { transform: perspective(240px) rotateY(0deg); }
        }
        .rank-flip-anim { animation: rankFlip 0.6s cubic-bezier(.4,0,.2,1) both; display: inline-block; }
        @keyframes rankUpBurst {
            0% { opacity: 0; transform: scale(0.6); }
            30% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0; transform: scale(1.6); }
        }
        .rank-up-burst {
            position: absolute; inset: -6px; border-radius: 999px; pointer-events: none;
            border: 2px solid rgba(250,204,21,0.85); animation: rankUpBurst 0.7s ease-out forwards;
        }

        /* ===== 論点 編集モード（並び替え・一括削除） ===== */
        .edit-row { touch-action: pan-y; }
        .edit-row.is-dragging { z-index: 40; touch-action: none; }
        .drag-handle { touch-action: none; cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        @keyframes checkPop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
        .check-pop { animation: checkPop 0.2s ease-out; }

        /* ===== ランクピラミッド行：改行防止レイアウト ===== */
        .pyramid-row { white-space: nowrap; flex-wrap: nowrap; }
        .pyramid-row > span { white-space: nowrap; }
    </style>

        const SORT_OPTIONS = [

        const SCORE_DISTRIBUTION_RAW = "96:2,95:0,94:0,93:0,92:0,91:0,90:54,89:73,88:0,87:28,86:43,85:65,84:59,83:72,82:100,81:108,80:147,79:144,78:139,77:158,76:152,75:218,74:194,73:197,72:195,71:162,70:222,69:199,68:186,67:202,66:191,65:200,64:222,63:164,62:179,61:169,60:201,59:171,58:168,57:180,56:193,55:181,54:161,53:129,52:199,51:177,50:197,49:138,48:144,47:180,46:138,45:195,44:160,43:160,42:189,41:207,40:187,39:190,38:185,37:200,36:201,35:212,34:199,33:204,32:219,31:246,30:246,29:224,28:226,27:230,26:233,25:241,24:198,23:187,22:182,21:175,20:135,19:116,18:96,17:81,16:42,15:38,14:18,13:29,12:18,11:13,10:23,9:14,8:7,7:15,6:7,5:7,4:5,3:2,2:5,1:0,0:1";

            const [r, c] = s.split(':').map(Number);
            return { rate: r, count: c };
        });
        const SCORE_DISTRIBUTION_MAX_RATE = Math.max(...SCORE_DISTRIBUTION.map(d => d.rate));
        const SCORE_DISTRIBUTION_TOTAL = SCORE_DISTRIBUTION.reduce((s, d) => s + d.count, 0);
        const SCORE_DISTRIBUTION_MAX_COUNT = Math.max(...SCORE_DISTRIBUTION.map(d => d.count), 1);
        const GRADE_STYLES = {
            S: 'text-fuchsia-200 border-fuchsia-300/60 bg-fuchsia-500/15',
