<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>復習マネージャー</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHvv2J4RXuayFasYSNRB90poh0k7SEQ0w",
            authDomain: "study-app-57fe6.firebaseapp.com",
            projectId: "study-app-57fe6",
            storageBucket: "study-app-57fe6.firebasestorage.app",
            messagingSenderId: "648009305814",
            appId: "1:648009305814:web:e91f8744b14e13eed04377",
            measurementId: "G-9KT48YMGJB"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase not initialized", e);
        }
        
        // 以前のアプリと同じIDにしておくと、過去に保存した復習データ（cpa_memory）を引き継げます
        const appId = 'score-chart-stable';

        window.fb = { auth, db, appId, collection, query, onSnapshot, addDoc, deleteDoc, updateDoc, doc, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #cbd5e1; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide && window.lucide.icons[name]) {
                    spanRef.current.innerHTML = '';
                    const iconNode = window.lucide.createElement(window.lucide.icons[name]);
                    iconNode.setAttribute('width', size);
                    iconNode.setAttribute('height', size);
                    iconNode.setAttribute('class', className);
                    spanRef.current.appendChild(iconNode);
                }
            }, [name, size, className]);
            return <span ref={spanRef} className={`inline-block ${className}`} />;
        };

        const SUBJECTS = ['財務会計論(計算)', '財務会計論(理論)', '管理会計論', '企業法', '監査論', 'その他'];
        const S_VALUES = [20, 35, 67, 148, 468]; 
        
        const getMemoryRetention = (hours, reviewCount) => {
            if (hours <= 0) return 100;
            const s = S_VALUES[Math.min(reviewCount, S_VALUES.length - 1)];
            const rate = 100 * Math.exp(-hours / s);
            return Math.max(20, rate); 
        };

        const getHoursSince = (isoString) => {
            if (!isoString) return 0;
            const d = new Date(isoString);
            return Math.max(0, (new Date() - d) / (1000 * 60 * 60));
        };

        function App() {
            const [user, setUser] = useState(null);
            const [topics, setTopics] = useState([]); 
            const [loading, setLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [memoryFormData, setMemoryFormData] = useState({ title: '', subject: '財務会計論(計算)' });
            const [expandedSubjects, setExpandedSubjects] = useState(SUBJECTS.reduce((acc, sub) => ({ ...acc, [sub]: true }), {}));

            // 認証状態の監視
            useEffect(() => {
                if(window.fb && window.fb.auth) {
                    return window.fb.onAuthStateChanged(window.fb.auth, (currentUser) => {
                        setUser(currentUser);
                        setLoading(false);
                    });
                } else {
                    setLoading(false);
                }
            }, []);

            // ログイン処理
            const handleLogin = async () => {
                if(window.fb && window.fb.auth) {
                    const provider = new window.fb.GoogleAuthProvider();
                    try {
                        await window.fb.signInWithPopup(window.fb.auth, provider);
                    } catch (error) {
                        console.error("Login failed:", error);
                        alert("ログインに失敗しました。");
                    }
                }
            };

            // ログアウト処理
            const handleLogout = async () => {
                if(window.fb && window.fb.auth) {
                    try {
                        await window.fb.signOut(window.fb.auth);
                    } catch (error) {
                        console.error("Logout failed:", error);
                    }
                }
            };

            // データ取得
            useEffect(() => {
                if (!user) {
                    setTopics([]);
                    return;
                }
                if (window.fb && window.fb.db) {
                    const { db, appId, collection, query, onSnapshot } = window.fb;
                    try {
                        const unsubMemory = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory')), (snapshot) => {
                            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setTopics(data.sort((a, b) => new Date(b.lastStudiedAt) - new Date(a.lastStudiedAt)));
                        }, (err) => {
                            console.error("Fetch error:", err);
                        });
                        return () => unsubMemory();
                    } catch(e) { 
                        console.error(e);
                    }
                }
            }, [user]);

            const groupedTopics = useMemo(() => {
                const groups = {}; SUBJECTS.forEach(sub => groups[sub] = []);
                topics.forEach(t => { const s = t.subject || 'その他'; if(groups[s]) groups[s].push(t); else groups['その他'].push(t); });
                return groups;
            }, [topics]);

            const handleAddTopic = async (e) => {
                e.preventDefault(); 
                if (!memoryFormData.title.trim() || isSubmitting || !user) return; 
                setIsSubmitting(true);
                const newTopic = { 
                    title: memoryFormData.title.trim(), 
                    subject: memoryFormData.subject, 
                    lastStudiedAt: new Date().toISOString(), 
                    reviewCount: 0, 
                    createdAt: new Date().toISOString() 
                };
                try {
                    if (window.fb && window.fb.db) {
                        const { db, appId, collection, addDoc } = window.fb;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory'), newTopic);
                    }
                    setMemoryFormData({ ...memoryFormData, title: '' }); 
                    setExpandedSubjects(prev => ({...prev, [memoryFormData.subject]: true}));
                } finally { 
                    setIsSubmitting(false); 
                }
            };

            const handleAction = async (action, id, data) => {
                if (!user) return;
                if (action === 'delete') { 
                    if (!window.confirm("削除しますか？")) return;
                    if (window.fb && window.fb.db) {
                        const { db, doc, deleteDoc, appId } = window.fb;
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, data.col, id));
                    }
                }
                if (action === 'update') { 
                    if (window.fb && window.fb.db) {
                        const { db, doc, updateDoc, appId } = window.fb;
                        await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, data.col, id), data.updates);
                    }
                }
            };

            const toggleSubject = (sub) => {
                setExpandedSubjects(prev => ({ ...prev, [sub]: !prev[sub] }));
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-indigo-500 mono text-xs animate-pulse">LOADING...</div>;

            // ログイン画面
            if (!user) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 space-y-8 pb-safe">
                        <div className="text-center space-y-4">
                            <Icon name="BrainCircuit" size={64} className="text-indigo-500 mx-auto" />
                            <h1 className="text-3xl font-black text-white tracking-wider">復習マネージャー</h1>
                            <p className="text-slate-400 text-sm font-bold">データはクラウドに安全に保存されます</p>
                        </div>
                        <button onClick={handleLogin} className="bg-white text-black hover:bg-slate-200 font-black py-4 px-8 rounded-2xl shadow-xl active:scale-[0.98] transition-all flex items-center gap-3 w-full max-w-sm justify-center">
                            <Icon name="LogIn" size={20} />
                            Googleでログイン
                        </button>
                    </div>
                );
            }

            const TopicCard = ({ t }) => {
                const hrs = getHoursSince(t.lastStudiedAt); const ret = getMemoryRetention(hrs, t.reviewCount);
                const pts = Array.from({length:85}, (_,i)=>`${(i*2/168)*200},${50-(getMemoryRetention(i*2, t.reviewCount)/100)*40}`).join(' ');
                const isGood = ret >= 70; const isWarn = ret >= 40;
                return (
                    <div className="bg-[#111] rounded-2xl border border-white/10 p-5 flex flex-col gap-4 shadow-lg">
                        <div className="flex justify-between items-start">
                            <div><h3 className="text-base font-bold text-white leading-tight">{t.title}</h3><p className="text-xs text-slate-400 mono mt-1">復習回数: {t.reviewCount} 回</p></div>
                            <div className="text-right"><span className="text-xs font-bold text-white block mono mb-1">現在の定着率</span><span className={`text-2xl font-black mono tracking-tighter ${isGood?'text-indigo-400':isWarn?'text-yellow-400':'text-red-400'}`}>{Math.floor(ret)}%</span></div>
                        </div>
                        <div className="h-20 w-full relative bg-black/50 rounded-xl border border-white/5 p-2 overflow-visible z-10">
                            <svg viewBox="0 0 200 50" className="w-full h-full overflow-visible"><line x1="0" y1="30" x2="200" y2="30" stroke="#fff" strokeOpacity="0.2" strokeDasharray="2,2" /><polyline fill="none" stroke="#6366f1" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts} opacity="0.6"/><circle cx={(Math.min(hrs,168)/168)*200} cy={50-(ret/100)*40} r="4" fill={isGood?'#818cf8':isWarn?'#facc15':'#f87171'} stroke="#000" strokeWidth="1.5" className="transition-all duration-300" /></svg>
                            <div className="absolute bottom-1 left-2 right-2 flex justify-between text-[9px] mono text-slate-500 font-bold"><span>0h</span><span>7 days</span></div>
                        </div>
                        <div className="flex justify-between items-center mt-1 z-10">
                            <button onClick={()=>handleAction('delete',t.id,{col:'cpa_memory'})} className="text-slate-500 hover:text-red-400 p-2"><Icon name="X" size={18} /></button>
                            <button onClick={()=>handleAction('update',t.id,{col:'cpa_memory',updates:{lastStudiedAt:new Date().toISOString(),reviewCount:(t.reviewCount||0)+1}})} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold mono py-2.5 px-6 rounded-xl shadow-lg active:scale-95 transition-all text-sm flex items-center gap-2"><Icon name="Brain" size={18} /> 復習した！</button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-black/95 border-b border-white/10 p-4 shadow-2xl sticky top-0 z-50">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <h1 className="text-sm font-black text-white tracking-widest flex items-center gap-2">
                                <Icon name="BrainCircuit" size={18} className="text-indigo-400" /> 復習マネージャー
                            </h1>
                            <button onClick={handleLogout} className="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 bg-white/5 px-3 py-1.5 rounded-full">
                                <Icon name="LogOut" size={12}/> ログアウト
                            </button>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-6 animate-in">
                        <form onSubmit={handleAddTopic} className="bg-[#111] p-5 rounded-3xl border border-white/10 flex flex-col gap-4 shadow-lg">
                            <div className="space-y-2">
                                <label className="text-xs font-black text-white uppercase mono tracking-widest ml-1">科目を選択</label>
                                <select className="w-full bg-black border border-white/20 p-4 rounded-xl outline-none font-bold text-white text-sm" value={memoryFormData.subject} onChange={e=>setMemoryFormData({...memoryFormData, subject: e.target.value})}>{SUBJECTS.map(o=><option key={o} value={o}>{o}</option>)}</select>
                            </div>
                            <div className="space-y-2">
                                <label className="text-xs font-black text-white uppercase mono tracking-widest ml-1">論点を追加</label>
                                <div className="flex gap-2">
                                    <input type="text" placeholder="例: 有価証券、リース" className="flex-1 bg-black border border-white/20 p-4 rounded-xl outline-none font-bold text-white text-base" value={memoryFormData.title} onChange={e=>setMemoryFormData({...memoryFormData, title: e.target.value})} required />
                                    <button type="submit" disabled={isSubmitting} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 rounded-xl font-bold flex items-center justify-center transition-colors"><Icon name="Plus" size={24} /></button>
                                </div>
                            </div>
                        </form>

                        <div className="space-y-4">
                            {SUBJECTS.filter(s=>groupedTopics[s].length>0).length===0 ? (
                                <div className="text-center py-16 text-slate-400 text-sm font-bold border-2 border-dashed border-white/10 rounded-3xl">論点を登録して記憶をトラッキングしましょう</div>
                            ) : (
                                SUBJECTS.filter(s=>groupedTopics[s].length>0).map(sub => (
                                    <div key={sub} className="bg-[#111]/50 rounded-3xl border border-white/10 overflow-hidden shadow-lg">
                                        <button onClick={()=>toggleSubject(sub)} className="w-full flex items-center justify-between p-5 bg-black/40 hover:bg-black/60">
                                            <div className="flex items-center gap-3"><Icon name="FolderTree" size={20} className="text-indigo-400" /><span className="font-bold text-white text-base">{sub}</span><span className="bg-white/10 text-white text-xs mono font-bold px-2 py-0.5 rounded-full">{groupedTopics[sub].length}</span></div>
                                            <Icon name={expandedSubjects[sub] ? 'ChevronUp' : 'ChevronDown'} size={24} className="text-slate-400" />
                                        </button>
                                        {expandedSubjects[sub] && <div className="p-4 space-y-4 border-t border-white/5">{groupedTopics[sub].map(t => <TopicCard key={t.id} t={t} />)}</div>}
                                    </div>
                                ))
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
