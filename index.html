                                            <button type="button" onClick={() => setShowSortMenu(v => !v)} className={`text-xs font-bold flex items-center gap-1 px-3 py-1.5 rounded-full transition-colors ${sortKey !== 'order' ? 'bg-indigo-600 text-white' : 'bg-[var(--bg-card-soft)] text-[var(--text-tertiary)] hover:bg-[var(--bg-card-soft-hover)]'}`}>
                                                <Icon name="ArrowUpDown" size={12} />
                                                並び替え{sortKey !== 'order' && `：${SORT_OPTIONS.find(o => o.key === sortKey)?.label}`}
                                            </button>
                                            {showSortMenu && (
                                                <>
                                                    <div className="fixed inset-0 z-40" onClick={() => setShowSortMenu(false)}></div>
                                                    <div className="absolute right-0 mt-2 w-52 bg-[var(--bg-card)] border border-[var(--border-strong)] rounded-2xl shadow-2xl z-50 overflow-hidden animate-in">
                                                        {SORT_OPTIONS.map(opt => (
                                                            <button
                                                                type="button" key={opt.key}
                                                                onClick={() => { setSortKey(sortKey === opt.key ? 'order' : opt.key); setShowSortMenu(false); }}
                                                                className={`w-full text-left px-4 py-2.5 flex items-center gap-2.5 transition-colors ${sortKey === opt.key ? 'bg-indigo-600 text-white' : 'text-[var(--text-secondary)] hover:bg-[var(--bg-card-soft-hover)]'}`}
                                                            >
                                                                <Icon name={opt.icon} size={14} className="shrink-0" />
                                                                <span className="flex flex-col leading-tight">
                                                                    <span className="text-xs font-bold">{opt.label}</span>
                                                                    <span className={`text-[10px] ${sortKey === opt.key ? 'text-indigo-100' : 'text-[var(--text-muted)]'}`}>{opt.sub}</span>
                                                                </span>
                                                                {sortKey === opt.key && <Icon name="Check" size={14} className="ml-auto shrink-0" />}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                        {tabs.find(t => t.name === activeSubject)?.id && (
                                            <button type="button" onClick={() => handleDeleteSubject(tabs.find(t => t.name === activeSubject))} className="text-xs font-bold flex items-center gap-1 px-2.5 py-1.5 rounded-full bg-[var(--bg-card-soft)] text-[var(--text-muted)] hover:text-red-400 hover:bg-[var(--bg-card-soft-hover)] transition-colors">
                                                <Icon name="Trash2" size={12} />
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {visibleTopics.length === 0 ? (
                                    <div className="text-center py-16 text-[var(--text-tertiary)] text-sm font-bold border-2 border-dashed border-[var(--border-color)] rounded-3xl">論点を登録して記憶をトラッキングしましょう</div>
                                ) : (
                                    <div className="space-y-4">
                                        {visibleTopics.map((t) => <TopicCard key={t.id} t={t} onReview={handleReviewAction} />)}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 学習が進むほど頻度が下がるため、追加フォームはリストの一番下（ナビゲーションバーの直前）に配置 */}
                        <form onSubmit={handleAddTopic} className="bg-[var(--bg-card)] p-5 rounded-3xl border border-[var(--border-color)] flex flex-col gap-3 shadow-lg">
                            <label className="text-xs font-black text-[var(--text-primary)] uppercase mono tracking-widest ml-1 flex items-center gap-2">
                                <Icon name="FolderTree" size={14} className="text-indigo-400" /> {activeSubject || '—'} に論点を追加
                            </label>
                            <div className="flex gap-2">
                                <input type="text" placeholder="例: 有価証券、リース" className="flex-1 bg-[var(--bg-input)] border border-[var(--border-strong)] p-4 rounded-xl outline-none font-bold text-[var(--text-primary)] text-base" value={newTopicTitle} onChange={e => setNewTopicTitle(e.target.value)} required />
                                <button type="submit" disabled={isSubmitting || !activeSubject} className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white px-5 rounded-xl font-bold flex items-center justify-center transition-colors"><Icon name="Plus" size={24} /></button>
                            </div>
                        </form>
                        </>
                        ) : (
                            <StatsView />
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 z-50 bg-[var(--bg-header)] backdrop-blur border-t border-[var(--border-color)] pb-safe">
                        <div className="max-w-md mx-auto grid grid-cols-2 gap-2 p-3">
                            <button type="button" onClick={() => setView('review')} className={`flex flex-col items-center gap-1 py-2 rounded-2xl text-xs font-bold transition-colors ${view === 'review' ? 'bg-indigo-600 text-white' : 'text-[var(--text-tertiary)] hover:bg-[var(--bg-card-soft)]'}`}>
                                <Icon name="Brain" size={20} />
                                復習
                            </button>
                            <button type="button" onClick={() => setView('stats')} className={`flex flex-col items-center gap-1 py-2 rounded-2xl text-xs font-bold transition-colors ${view === 'stats' ? 'bg-indigo-600 text-white' : 'text-[var(--text-tertiary)] hover:bg-[var(--bg-card-soft)]'}`}>
                                <Icon name="LineChart" size={20} />
                                グラフ
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
