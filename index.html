        /* ===== 復習ゲージフィル演出（赤→青／左→右／1.5秒） ===== */
        @keyframes reviewGaugeFill {
            0% { clip-path: inset(0 100% 0 0); }

        }
        @keyframes reviewEdgeMove {
            0% { left: -4%; opacity: 0; }

            94% { opacity: 1; }

        }
        .review-fill-el { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; z-index: 5; }
        .review-fill-el::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg,

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {

                    spanRef.current.appendChild(iconNode);

        };

        const DEFAULT_SUBJECTS = ['財務会計論(計算)', '財務会計論(理論)', '管理会計論', '企業法', '監査論'];

                'キャッシュ・フロー計算書', '連結税効果', 'リース・貸倒引当金', '企業結合・事業分離',

                '研究開発費・固定資産の減損', '退職給付・資産除去債務', '資本会計', 'ストック・オプション',
                '外貨建取引等 税効果会計', 'リース取引・会計上の変更及び誤謬の訂正', '中間財務諸表・金融商品',
                '収益認識', '連結財務諸表', '持分法,包括利益', '退職給付・外貨建取引等', '企業結合・事業分離等',
                '連結キャッシュ・フロー計算書・概念フレームワーク', '概念フレームワーク・セグメント情報等の開示',
                '会計基準等・関連当事者の開示等'
            ],
            '管理会計論': [
                '原価計算総論・材料費', '労務費', '経費・製造間接費', '部門別計算・個別原価計算', '総合原価計算',
                '標準原価計算', 'CVP分析', '予算管理・財務分析', '資金管理', '意思決定会計', '分権組織',
                '原価管理・活動基準原価計算(ABC)'
            ],
            '企業法': [
                '機関', '株式', '設立・資金調達', '株式会社の計算 組織再編行為等', '事業譲渡等・商法総則・商行為法',
                '金融商品取引法'
            ],
            '監査論': [
                '監査の全体像・監査総論', '内部統制・リスクアプローチ監査', '監査サンプリング・監査計画', '監査報告',
                'その他の諸論点・監査の品質管理', '不正・法令違反', 'コミュニケーション・関連当事者',
                '保証業務・内部統制監査', '公認会計士法・監査制度'
            ]
        };
        const REVIEW_THRESHOLD = 65;
        const DEFAULT_REVIEW_INTERVALS = [1, 3, 7, 14, 30, 45, 60, 60]; // 日数（8番目以降はこの値がずっと適用される）
        const DEFAULT_SETTINGS = { weeklyGoal: 15, monthlyGoal: 60, theme: 'dark', lastLoginDate: null, currentStreak: 0, bestStreak: 0, reviewIntervals: DEFAULT_REVIEW_INTERVALS };

        const RANKS = ['E', 'D', 'C', 'B', 'A', 'S', 'SS', 'SSS'];
        const SORT_OPTIONS = [
            { key: 'lastStudied', label: '最終復習日', sub: '古い順（要復習優先）', icon: 'CalendarClock' },
            { key: 'reviewCount', label: '復習回数', sub: '少ない順', icon: 'Repeat' },
            { key: 'retention', label: '定着率', sub: '低い順（要復習優先）', icon: 'Gauge' }
        ];
        const RANK_STYLES = {
            E: 'bg-slate-500/15 text-slate-400 border-slate-400/30',
            D: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30 rank-aura-d',
            C: 'bg-sky-500/15 text-sky-400 border-sky-500/30 rank-aura-c',
            B: 'bg-indigo-500/15 text-indigo-400 border-indigo-500/30 rank-aura-b',
            A: 'bg-purple-500/15 text-purple-400 border-purple-500/30 rank-aura-a',
            S: 'border-amber-300/70 rank-aura-s',
            SS: 'bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-400/40 rank-aura-ss',
            SSS: 'border-white/50 rank-aura-sss'
        };
        const getRank = (rc) => RANKS[Math.min(rc || 0, RANKS.length - 1)];

        const vibrate = (pattern) => {
            try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
        };

        // エンジンが吹け上がるような、1.5秒間持続する振動パターンを生成
        // (onTimeが徐々に長く、offTimeが徐々に短くなることで「加速感」を演出)
        const buildRevVibratePattern = (durationMs = 1500, pulses = 15) => {
            const raw = [];
            let sum = 0;
            for (let i = 0; i < pulses; i++) {
                const t = i / (pulses - 1);
                const on = 26 + t * 78;   // 26ms → 104ms へ加速
                const off = 42 - t * 30;  // 42ms → 12ms へ短縮
                raw.push(on, off);
                sum += on + off;
            }
            const scale = durationMs / sum;
            return raw.map(v => Math.max(4, Math.round(v * scale)));
        };

        // Web Audio APIでApple UIのような短く心地よいサイン波の合成音を鳴らす
        let __audioCtx = null;
        const getAudioCtx = () => {
            try {
                if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (__audioCtx.state === 'suspended') __audioCtx.resume();
                return __audioCtx;
            } catch (e) { return null; }
        };
        const playReviewSound = () => {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            // 低域（100〜200Hz）のサイン波＋極短デケイ（約0.05秒）で、高級スイッチのような「コツッ」を合成
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(190, now);
            osc.frequency.exponentialRampToValueAtTime(105, now + 0.05);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.55, now + 0.004);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.07);

            // わずかな高域トランジェントでスイッチの「アタック感」を補強
            const tOsc = ctx.createOscillator();
            const tGain = ctx.createGain();
            tOsc.type = 'triangle';
            tOsc.frequency.setValueAtTime(1500, now);
            tGain.gain.setValueAtTime(0.0001, now);
            tGain.gain.exponentialRampToValueAtTime(0.08, now + 0.002);
            tGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.016);
            tOsc.connect(tGain).connect(ctx.destination);
            tOsc.start(now);
            tOsc.stop(now + 0.03);
        };

        // 長押しチャージ中の「コップに水が満たされていく」ような、耳に気持ちいい水滴音
        // (sine波の短い粒を等間隔で連続再生しながら、徐々にピッチを上げていく)
        let __chargeDroplets = [];
        const startChargeSound = (durationMs = 1200) => {
            const ctx = getAudioCtx();
            if (!ctx) return;
            stopChargeSound();
            const now = ctx.currentTime;
            const totalSec = durationMs / 1000;
            const dropletCount = Math.round(durationMs / 85); // 約85msごとに一粒
            const list = [];
            for (let i = 0; i < dropletCount; i++) {
                const t = i / Math.max(1, dropletCount - 1); // 0..1
                const startTime = now + t * totalSec * 0.9; // 最後の一粒は完了直前に鳴らし切る
                const freq = 480 + t * t * 1500; // 徐々にピッチが上がる「ポロポロポロ」
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);
                osc.frequency.exponentialRampToValueAtTime(Math.max(100, freq * 0.72), startTime + 0.09);
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.006);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.1);
                osc.connect(gain).connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.12);
                list.push(osc);
            }
            __chargeDroplets = list;
        };
        const stopChargeSound = () => {
            const ctx = getAudioCtx();
            const now = ctx ? ctx.currentTime : 0;
            __chargeDroplets.forEach(osc => { try { osc.stop(now); } catch (e) {} });
            __chargeDroplets = [];
        };

        const computeSValues = (intervalDays) => {
            const thresholdFrac = REVIEW_THRESHOLD / 100;
            return (intervalDays && intervalDays.length ? intervalDays : DEFAULT_REVIEW_INTERVALS).map(d => -(Math.max(0.1, d) * 24) / Math.log(thresholdFrac));
        };

        const getMemoryRetention = (hours, reviewCount, sValues) => {
            if (hours <= 0) return 100;
            const values = sValues && sValues.length ? sValues : computeSValues(DEFAULT_REVIEW_INTERVALS);
            const s = values[Math.min(reviewCount, values.length - 1)];
            const rate = 100 * Math.exp(-hours / s);
            return Math.max(20, rate);
        };

        const getHoursSince = (isoString) => {
            if (!isoString) return 0;
            const d = new Date(isoString);
            return Math.max(0, (new Date() - d) / (1000 * 60 * 60));
        };

        const getNextIntervalHours = (reviewCount, intervalDays) => {
            const days = intervalDays && intervalDays.length ? intervalDays : DEFAULT_REVIEW_INTERVALS;
            return days[Math.min(reviewCount, days.length - 1)] * 24;
        };

        const toDatetimeLocalValue = (isoString) => {
            if (!isoString) return '';
            const d = new Date(isoString);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };
        const fromDatetimeLocalValue = (val) => {
            if (!val) return new Date().toISOString();
            return new Date(val).toISOString();
        };

        const getLocalDateKey = (d = new Date()) => {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        };
        const getStartOfDay = (d = new Date()) => { const s = new Date(d); s.setHours(0, 0, 0, 0); return s; };
        const getStartOfWeek = (d = new Date()) => {
            const day = d.getDay();
            const diff = (day === 0 ? -6 : 1) - day;
            const monday = new Date(d);
            monday.setHours(0, 0, 0, 0);
            monday.setDate(d.getDate() + diff);
            return monday;
        };
        const getStartOfMonth = (d = new Date()) => { const m = new Date(d.getFullYear(), d.getMonth(), 1); m.setHours(0, 0, 0, 0); return m; };

        // 数値がパラパラッとカウントアップし、到達時にフワッと光る演出（トップレベルで定義し、親の再レンダーでも状態を保持）
        const CountUpNumber = ({ value, prefix = '', suffix = '', className = '' }) => {
            const [display, setDisplay] = useState(value);
            const [pulse, setPulse] = useState(false);
            const prevRef = useRef(value);
            const rafRef = useRef(null);
            const mountedRef = useRef(false);

            useEffect(() => {
                if (!mountedRef.current) { mountedRef.current = true; prevRef.current = value; setDisplay(value); return; }
                const from = prevRef.current;
                const to = value;
                if (from === to) return;
                prevRef.current = to;
                const duration = 700;
                const start = performance.now();
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                const tick = (now) => {
                    const p = Math.min(1, (now - start) / duration);
                    const eased = 1 - Math.pow(1 - p, 3);
                    setDisplay(Math.round(from + (to - from) * eased));
                    if (p < 1) {
                        rafRef.current = requestAnimationFrame(tick);
                    } else {
                        setDisplay(to);
                        setPulse(true);
                        setTimeout(() => setPulse(false), 550);
                    }
                };
                rafRef.current = requestAnimationFrame(tick);
                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, [value]);

            return <span className={`${className} ${pulse ? 'count-pop-flash' : ''}`}>{prefix}{display}{suffix}</span>;
        };

        // 論点ごとの個別復習間隔設定モーダル（全体設定より優先される）
        const TopicIntervalModal = ({ topic, globalIntervals, onClose, onSave }) => {
            const initialEnabled = Array.isArray(topic.customIntervals) && topic.customIntervals.length === DEFAULT_REVIEW_INTERVALS.length;
            const [enabled, setEnabled] = useState(initialEnabled);
            const [form, setForm] = useState((initialEnabled ? topic.customIntervals : globalIntervals).slice());
            const [saved, setSaved] = useState(false);

            const updateField = (idx, val) => {
                const next = form.slice();
                next[idx] = val;
                setForm(next);
            };

            const handleSave = () => {
                const parsed = form.map(v => Math.max(0.1, parseFloat(v) || 0.1));
                onSave(parsed, enabled);
                setSaved(true);
                setTimeout(() => { setSaved(false); onClose(); }, 700);
            };

            return (
                <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center">
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full sm:max-w-md max-h-[88vh] overflow-y-auto bg-[var(--bg-app-to)] border border-[var(--border-color)] rounded-t-3xl sm:rounded-3xl shadow-2xl animate-in">
                        <div className="sticky top-0 bg-[var(--bg-header)] backdrop-blur border-b border-[var(--border-color)] px-5 py-4 flex items-center justify-between z-10">
                            <h2 className="text-sm font-black text-[var(--text-primary)] flex items-center gap-2 min-w-0">
                                <Icon name="Settings2" size={16} className="text-indigo-400 shrink-0" />
                                <span className="truncate">{topic.title} の個別設定</span>
                            </h2>
                            <button type="button" onClick={onClose} className="h-8 w-8 shrink-0 flex items-center justify-center text-[var(--text-tertiary)] hover:text-[var(--text-primary)] bg-[var(--bg-card-soft)] rounded-full transition-colors active:scale-90">
                                <Icon name="X" size={14} />
                            </button>
                        </div>

                        <div className="p-5 space-y-5">
                            <button
                                type="button"
                                onClick={() => setEnabled(v => !v)}
                                className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl border transition-colors ${enabled ? 'bg-indigo-600/15 border-indigo-500/50 text-indigo-300' : 'bg-[var(--bg-card-soft)] border-[var(--border-color)] text-[var(--text-secondary)]'}`}
                            >
                                <span className="text-xs font-bold flex items-center gap-2">
                                    <Icon name={enabled ? 'ToggleRight' : 'ToggleLeft'} size={18} />
                                    この論点だけ個別の復習間隔を使う
                                </span>
                                <span className="text-[10px] font-bold">{enabled ? '個別設定 ON' : '全体設定を使用'}</span>
                            </button>

                            <div className={`space-y-3 transition-opacity ${enabled ? 'opacity-100' : 'opacity-40 pointer-events-none'}`}>
                                <p className="text-[10px] text-[var(--text-tertiary)] font-bold">この論点の復習まで、それぞれ何日空けるかを設定できます。「8回目以降」はそれ以降ずっと同じ間隔が適用されます。</p>
                                <div className="grid grid-cols-2 gap-3">
                                    {form.map((d, idx) => (
                                        <div key={idx}>
                                            <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mb-1">{idx === form.length - 1 ? `${idx + 1}回目以降` : `${idx + 1}回目の間隔`}</label>
                                            <div className="relative">
                                                <input
                                                    type="number" min="0.1" step="0.5" disabled={!enabled}
                                                    className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-2.5 pr-9 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm mono-num"
                                                    value={d} onChange={e => updateField(idx, e.target.value)}
                                                />
                                                <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-[var(--text-muted)] mono">日後</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button type="button" onClick={handleSave} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition-colors flex items-center justify-center gap-1.5">
                                <Icon name={saved ? "Check" : "Save"} size={14} />{saved ? '保存しました' : '保存する'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [topics, setTopics] = useState([]);
            const [subjectsDb, setSubjectsDb] = useState([]);
            const [statsHistory, setStatsHistory] = useState([]);
            const [reviewLog, setReviewLog] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [loading, setLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activeSubject, setActiveSubject] = useState(null);
            const [sortKey, setSortKey] = useState('order'); // 'order' | 'lastStudied' | 'reviewCount' | 'retention'
            const [showSortMenu, setShowSortMenu] = useState(false);
            const [showAddSubject, setShowAddSubject] = useState(false);
            const [newSubjectName, setNewSubjectName] = useState('');
            const [newTopicTitle, setNewTopicTitle] = useState('');
            const [view, setView] = useState('review');
            const [editingGoals, setEditingGoals] = useState(false);
            const [goalForm, setGoalForm] = useState({ weekly: DEFAULT_SETTINGS.weeklyGoal, monthly: DEFAULT_SETTINGS.monthlyGoal });
            const [showSettings, setShowSettings] = useState(false);
            const seededRef = useRef(false);
            const settingsLoadedRef = useRef(false);
            const streakCheckedRef = useRef(false);

            useEffect(() => {
                if (window.fb && window.fb.auth) {
                    return window.fb.onAuthStateChanged(window.fb.auth, (currentUser) => {
                        setUser(currentUser);
                        setLoading(false);
                    });
                } else {
                    setLoading(false);
                }
            }, []);

            const handleLogin = async () => {
                if (window.fb && window.fb.auth) {
                    const provider = new window.fb.GoogleAuthProvider();
                    try {
                        await window.fb.signInWithPopup(window.fb.auth, provider);
                    } catch (error) {
                        alert("ログインに失敗しました。");
                    }
                }
            };

            const handleLogout = async () => {
                if (window.fb && window.fb.auth) {
                    try { await window.fb.signOut(window.fb.auth); } catch (error) {}
                }
            };

            useEffect(() => {
                if (!user) { setTopics([]); setSubjectsDb([]); setStatsHistory([]); setReviewLog([]); seededRef.current = false; return; }
                if (window.fb && window.fb.db) {
                    const { db, appId, collection, query, onSnapshot } = window.fb;
                    const unsubMemory = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory')), (snapshot) => {
                        setTopics(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, (err) => console.error("Fetch error:", err));

                    const unsubSubjects = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects')), (snapshot) => {
                        setSubjectsDb(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, (err) => console.error("Fetch error:", err));

                    const unsubStats = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_stats')), (snapshot) => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        data.sort((a, b) => (a.date > b.date ? 1 : -1));
                        setStatsHistory(data);
                    }, (err) => console.error("Fetch error:", err));

                    const unsubLog = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_review_log')), (snapshot) => {
                        setReviewLog(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, (err) => console.error("Fetch error:", err));

                    return () => { unsubMemory(); unsubSubjects(); unsubStats(); unsubLog(); };
                }
            }, [user]);

            useEffect(() => {
                if (!user) { setSettings(DEFAULT_SETTINGS); settingsLoadedRef.current = false; streakCheckedRef.current = false; return; }
                if (window.fb && window.fb.db) {
                    const { db, appId, doc, onSnapshot } = window.fb;
                    const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_settings', 'main');
                    const unsub = onSnapshot(ref, (snap) => {
                        setSettings(snap.exists() ? { ...DEFAULT_SETTINGS, ...snap.data() } : DEFAULT_SETTINGS);
                        settingsLoadedRef.current = true;
                    }, (err) => console.error("Settings fetch error:", err));
                    return () => unsub();
                }
            }, [user]);

            // 連続ログイン記録（セッション中に一度だけ判定）
            useEffect(() => {
                if (!user || !settingsLoadedRef.current || streakCheckedRef.current) return;
                streakCheckedRef.current = true;
                const todayKey = getLocalDateKey();
                if (settings.lastLoginDate === todayKey) return;
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                const yKey = getLocalDateKey(yesterday);
                const newStreak = settings.lastLoginDate === yKey ? (settings.currentStreak || 0) + 1 : 1;
                const newBest = Math.max(settings.bestStreak || 0, newStreak);
                const { db, appId, doc, setDoc } = window.fb;
                setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_settings', 'main'), {
                    lastLoginDate: todayKey, currentStreak: newStreak, bestStreak: newBest
                }, { merge: true }).catch(err => console.error('Streak update error:', err));
            }, [user, settings]);

            // テーマ適用
            useEffect(() => {
                document.documentElement.classList.toggle('light', settings.theme === 'light');
            }, [settings.theme]);

            useEffect(() => {
                setGoalForm({ weekly: settings.weeklyGoal, monthly: settings.monthlyGoal });
            }, [settings.weeklyGoal, settings.monthlyGoal]);

            const handleToggleTheme = () => {
                if (!user) return;
                const next = settings.theme === 'light' ? 'dark' : 'light';
                const { db, appId, doc, setDoc } = window.fb;
                setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_settings', 'main'), { theme: next }, { merge: true }).catch(() => {});
                vibrate(10);
            };

            const handleSaveGoals = () => {
                if (!user) return;
                const weekly = Math.max(1, parseInt(goalForm.weekly, 10) || 1);
                const monthly = Math.max(1, parseInt(goalForm.monthly, 10) || 1);
                const { db, appId, doc, setDoc } = window.fb;
                setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_settings', 'main'), { weeklyGoal: weekly, monthlyGoal: monthly }, { merge: true }).catch(() => {});
                setEditingGoals(false);
            };

            const handleSaveIntervals = (newIntervals) => {
                if (!user) return;
                const { db, appId, doc, setDoc } = window.fb;
                setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_settings', 'main'), { reviewIntervals: newIntervals }, { merge: true }).catch(() => {});
            };

            // 初回のみデフォルトタブ＆論点を投入
            useEffect(() => {
                if (!user || seededRef.current) return;
                if (loading) return;
                if (subjectsDb.length === 0) {
                    seededRef.current = true;
                    (async () => {
                        const { db, appId, collection, addDoc } = window.fb;
                        for (let i = 0; i < DEFAULT_SUBJECTS.length; i++) {
                            const subjectName = DEFAULT_SUBJECTS[i];
                            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects'), {
                                name: subjectName, order: i, createdAt: new Date().toISOString()
                            });
                            const topicTitles = DEFAULT_TOPICS[subjectName] || [];
                            for (let j = 0; j < topicTitles.length; j++) {
                                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory'), {
                                    title: topicTitles[j], subject: subjectName, lastStudiedAt: new Date().toISOString(),
                                    reviewCount: 0, createdAt: new Date().toISOString(), order: Date.now() + j
                                });
                            }
                        }
                    })();
                } else {
                    seededRef.current = true;
                }
            }, [user, subjectsDb, loading]);

            const tabs = useMemo(() => {
                const map = {};
                subjectsDb.forEach(s => { map[s.name] = { id: s.id, name: s.name, order: s.order ?? 0 }; });
                let extraIndex = 1000;
                topics.forEach(t => {
                    const name = t.subject || 'その他';
                    if (!map[name]) { map[name] = { id: null, name, order: extraIndex++ }; }
                });
                return Object.values(map).sort((a, b) => a.order - b.order);
            }, [subjectsDb, topics]);

            useEffect(() => {
                if (tabs.length === 0) { setActiveSubject(null); return; }
                if (!activeSubject || !tabs.find(t => t.name === activeSubject)) {
                    setActiveSubject(tabs[0].name);
                }
            }, [tabs, activeSubject]);

            const intervalDays = useMemo(() => {
                const arr = settings.reviewIntervals;
                return (Array.isArray(arr) && arr.length === DEFAULT_REVIEW_INTERVALS.length) ? arr : DEFAULT_REVIEW_INTERVALS;
            }, [settings.reviewIntervals]);
            const sValues = useMemo(() => computeSValues(intervalDays), [intervalDays]);

            // 論点ごとの個別設定があればそちらを優先し、なければ全体設定を使う
            const getEffectiveIntervals = (t) => {
                const custom = t && t.customIntervals;
                return (Array.isArray(custom) && custom.length === DEFAULT_REVIEW_INTERVALS.length) ? custom : intervalDays;
            };

            const tabStats = useMemo(() => {
                const stats = {};
                tabs.forEach(t => { stats[t.name] = { total: 0, needReview: 0 }; });
                topics.forEach(t => {
                    const name = t.subject || 'その他';
                    if (!stats[name]) stats[name] = { total: 0, needReview: 0 };
                    stats[name].total += 1;
                    const hrs = getHoursSince(t.lastStudiedAt);
                    const ret = getMemoryRetention(hrs, t.reviewCount || 0, computeSValues(getEffectiveIntervals(t)));
                    if (ret <= REVIEW_THRESHOLD) stats[name].needReview += 1;
                });
                return stats;
            }, [tabs, topics, intervalDays]);

            const overallStats = useMemo(() => {
                let blue = 0, warn = 0, red = 0;
                topics.forEach(t => {
                    const hrs = getHoursSince(t.lastStudiedAt);
                    const ret = getMemoryRetention(hrs, t.reviewCount || 0, computeSValues(getEffectiveIntervals(t)));
                    if (ret > 80) blue++;
                    else if (ret > REVIEW_THRESHOLD) warn++;
                    else red++;
                });
                const total = topics.length;
                const percentage = total ? Math.round((blue / total) * 100) : 0;
                return { blue, warn, red, total, percentage };
            }, [topics, intervalDays]);

            const perSubjectGauge = useMemo(() => {
                return tabs.map(tab => {
                    const items = topics.filter(t => (t.subject || 'その他') === tab.name);
                    if (items.length === 0) return { name: tab.name, avg: null, count: 0 };
                    const avg = items.reduce((sum, t) => sum + getMemoryRetention(getHoursSince(t.lastStudiedAt), t.reviewCount || 0, computeSValues(getEffectiveIntervals(t))), 0) / items.length;
                    return { name: tab.name, avg, count: items.length };
                });
            }, [tabs, topics, intervalDays]);

            // 毎日の定着率（青の割合）をスナップショットとして保存
            useEffect(() => {
                if (!user || !window.fb || !window.fb.db) return;
                if (topics.length === 0) return;
                const { db, appId, doc, setDoc } = window.fb;
                const dateKey = getLocalDateKey();
                setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_stats', dateKey), {
                    date: dateKey, percentage: overallStats.percentage, blue: overallStats.blue,
                    warn: overallStats.warn, red: overallStats.red, total: overallStats.total,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(err => console.error('Stats snapshot error:', err));
            }, [user, overallStats.percentage, overallStats.total]);

            const visibleTopics = useMemo(() => {
                if (!activeSubject) return [];
                const list = topics.filter(t => (t.subject || 'その他') === activeSubject).slice();
                if (sortKey === 'lastStudied') {
                    // 最終復習日が古い順（＝要復習度が高いものが上に来る）
                    list.sort((a, b) => new Date(a.lastStudiedAt || 0) - new Date(b.lastStudiedAt || 0));
                } else if (sortKey === 'reviewCount') {
                    // 復習回数が少ない順
                    list.sort((a, b) => (a.reviewCount || 0) - (b.reviewCount || 0));
                } else if (sortKey === 'retention') {
                    // 定着率が低い順
                    list.sort((a, b) => {
                        const ra = getMemoryRetention(getHoursSince(a.lastStudiedAt), a.reviewCount || 0, computeSValues(getEffectiveIntervals(a)));
                        const rb = getMemoryRetention(getHoursSince(b.lastStudiedAt), b.reviewCount || 0, computeSValues(getEffectiveIntervals(b)));
                        return ra - rb;
                    });
                } else {
                    // 手動（追加順・ドラッグ順）
                    list.sort((a, b) => {
                        const oa = a.order ?? (a.createdAt ? new Date(a.createdAt).getTime() : 0);
                        const ob = b.order ?? (b.createdAt ? new Date(b.createdAt).getTime() : 0);
                        return oa - ob;
                    });
                }
                return list;
            }, [topics, activeSubject, sortKey, intervalDays]);

            const weeklyCount = useMemo(() => {
                const start = getStartOfWeek();
                return reviewLog.filter(r => new Date(r.timestamp) >= start).length;
            }, [reviewLog]);
            const monthlyCount = useMemo(() => {
                const start = getStartOfMonth();
                return reviewLog.filter(r => new Date(r.timestamp) >= start).length;
            }, [reviewLog]);
            const weeklyLog = useMemo(() => {
                const start = getStartOfWeek();
                return reviewLog.filter(r => new Date(r.timestamp) >= start);
            }, [reviewLog]);
            const weeklyRecovered = useMemo(() => weeklyLog.reduce((s, r) => s + (r.recovered || 0), 0), [weeklyLog]);

            const handleAddTopic = async (e) => {
                e.preventDefault();
                if (!newTopicTitle.trim() || isSubmitting || !user || !activeSubject) return;
                setIsSubmitting(true);
                const newTopic = {
                    title: newTopicTitle.trim(), subject: activeSubject, lastStudiedAt: new Date().toISOString(),
                    reviewCount: 0, createdAt: new Date().toISOString(), order: Date.now()
                };
                try {
                    if (window.fb && window.fb.db) {
                        const { db, appId, collection, addDoc } = window.fb;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory'), newTopic);
                    }
                    setNewTopicTitle('');
                    vibrate(10);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleAddSubject = async () => {
                const name = newSubjectName.trim();
                if (!name || !user) return;
                if (tabs.find(t => t.name === name)) { alert('同名のタブが既に存在します。'); return; }
                const { db, appId, collection, addDoc } = window.fb;
                const maxOrder = tabs.reduce((m, t) => Math.max(m, t.order), -1);
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects'), {
                    name, order: maxOrder + 1, createdAt: new Date().toISOString()
                });
                setNewSubjectName('');
                setShowAddSubject(false);
            };

            const handleDeleteSubject = async (tab) => {
                if (tabs.length <= 1) { alert('最後のタブは削除できません。'); return; }
                if ((tabStats[tab.name]?.total || 0) > 0) { alert('このタブには論点が残っています。先に論点を移動または削除してください。'); return; }
                if (!tab.id) return;
                if (!window.confirm(`「${tab.name}」タブを削除しますか？`)) return;
                const { db, appId, doc, deleteDoc } = window.fb;
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects', tab.id));
                if (activeSubject === tab.name) setActiveSubject(null);
            };

            const handleAction = async (action, id, data) => {
                if (!user) return;
                if (action === 'delete') {
                    if (!window.confirm("この論点を削除しますか？")) return;
                    const { db, doc, deleteDoc, appId } = window.fb;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, data.col, id));
                }
                if (action === 'update') {
                    const { db, doc, updateDoc, appId } = window.fb;
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, data.col, id), data.updates);
                }
            };

            // 並び替えは sortKey（visibleTopics の useMemo）でリアルタイムに反映されるため、
            // 個別の手動並び替え関数は不要になりました。

            const handleReviewAction = async (topic, retBefore) => {
                if (!user) return;
                const rc = topic.reviewCount || 0;
                const recovered = Math.max(0, Math.round(100 - retBefore));
                const { db, appId, doc, updateDoc, collection, addDoc } = window.fb;
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory', topic.id), {
                    lastStudiedAt: new Date().toISOString(), reviewCount: rc + 1
                });
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_review_log'), {
                    subject: topic.subject, timestamp: new Date().toISOString(), recovered
                });
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-indigo-500 mono text-xs animate-pulse">LOADING...</div>;

            if (!user) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 space-y-8 pb-safe bg-gradient-to-b from-[#0a0a0f] to-black">
                        <div className="text-center space-y-4">
                            <Icon name="BrainCircuit" size={64} className="text-indigo-500 mx-auto" />
                            <h1 className="text-3xl font-black text-white tracking-wider">復習マネージャー</h1>
                            <p className="text-slate-400 text-sm font-bold">データはクラウドに安全に保存されます</p>
                        </div>
                        <button type="button" onClick={handleLogin} className="bg-white text-black hover:bg-slate-200 font-black py-4 px-8 rounded-2xl shadow-xl active:scale-[0.98] transition-all flex items-center gap-3 w-full max-w-sm justify-center">
                            <Icon name="LogIn" size={20} /> Googleでログイン
                        </button>
                    </div>
                );
            }

            const RankBadge = ({ rc }) => {
                const rank = getRank(rc);
                return <span className={`text-[10px] font-black mono px-2 py-0.5 rounded-full border shrink-0 ${RANK_STYLES[rank]}`}>{rank}</span>;
            };

            const TopicCard = ({ t, onReview }) => {
                const [isEditing, setIsEditing] = useState(false);
                const [isSweeping, setIsSweeping] = useState(false);
                const [isShaking, setIsShaking] = useState(false);
                const [sweepKey, setSweepKey] = useState(0);
                const [popup, setPopup] = useState(null);
                const [holdProgress, setHoldProgress] = useState(0);
                const [isCharging, setIsCharging] = useState(false);
                const [showTopicSettings, setShowTopicSettings] = useState(false);
                const chargeRafRef = useRef(null);
                const chargeStartRef = useRef(0);
                const completedRef = useRef(false);
                const HOLD_DURATION = 1200;
                const [editForm, setEditForm] = useState({
                    title: t.title, subject: t.subject,
                    reviewCount: t.reviewCount || 0, lastStudiedAt: toDatetimeLocalValue(t.lastStudiedAt)
                });

                const isCustomInterval = Array.isArray(t.customIntervals) && t.customIntervals.length === DEFAULT_REVIEW_INTERVALS.length;
                const effIntervalDays = getEffectiveIntervals(t);
                const effSValues = computeSValues(effIntervalDays);

                const hrs = getHoursSince(t.lastStudiedAt);
                const rc = t.reviewCount || 0;
                const ret = getMemoryRetention(hrs, rc, effSValues);

                const targetHours = getNextIntervalHours(rc, effIntervalDays);
                const GRAPH_STEPS = 80;
                const pts = Array.from({ length: GRAPH_STEPS + 1 }, (_, i) => {
                    const h = (i / GRAPH_STEPS) * targetHours;
                    return `${(h / targetHours) * 200},${50 - (getMemoryRetention(h, rc, effSValues) / 100) * 40}`;
                }).join(' ');

                const isNeedsReview = ret <= REVIEW_THRESHOLD;
                const isWarn = ret <= 80 && !isNeedsReview;
                const isGood = ret > 80;

                const handleSaveEdit = () => {
                    if (!editForm.title.trim()) return;
                    handleAction('update', t.id, {
                        col: 'cpa_memory',
                        updates: {
                            title: editForm.title.trim(), subject: editForm.subject,
                            reviewCount: Math.max(0, parseInt(editForm.reviewCount, 10) || 0),
                            lastStudiedAt: fromDatetimeLocalValue(editForm.lastStudiedAt)
                        }
                    });
                    setIsEditing(false);
                };

                const fireReview = () => {
                    const recovered = Math.max(0, Math.round(100 - ret));
                    // 視覚(1.5秒)と完全同期したハプティクス（Android）とiOS向けヒットストップ・シェイク、SEを同時発火
                    vibrate(buildRevVibratePattern(1500));
                    playReviewSound();
                    setSweepKey(k => k + 1);
                    setIsSweeping(true);
                    setIsShaking(true);
                    setPopup({ id: Date.now(), text: `+${recovered}% 回復` });
                    setTimeout(() => setIsShaking(false), 420);
                    setTimeout(() => setIsSweeping(false), 1550);
                    setTimeout(() => setPopup(null), 1750);
                    onReview(t, ret);
                };

                const cancelCharge = () => {
                    if (chargeRafRef.current) cancelAnimationFrame(chargeRafRef.current);
                    chargeRafRef.current = null;
                    setIsCharging(false);
                    setHoldProgress(0);
                };

                const startCharge = (e) => {
                    if (e.cancelable) e.preventDefault();
                    if (isEditing) return;
                    completedRef.current = false;
                    setIsCharging(true);
                    setHoldProgress(0);
                    chargeStartRef.current = performance.now();
                    startChargeSound(HOLD_DURATION);
                    vibrate(8);
                    const tick = (now) => {
                        const elapsed = now - chargeStartRef.current;
                        const pct = Math.min(100, (elapsed / HOLD_DURATION) * 100);
                        setHoldProgress(pct);
                        if (pct >= 100) {
                            completedRef.current = true;
                            setIsCharging(false);
                            fireReview();
                            setHoldProgress(0);
                            return;
                        }
                        chargeRafRef.current = requestAnimationFrame(tick);
                    };
                    chargeRafRef.current = requestAnimationFrame(tick);
                };

                const endCharge = () => {
                    if (completedRef.current) { completedRef.current = false; return; }
                    stopChargeSound();
                    cancelCharge();
                };

                useEffect(() => () => { if (chargeRafRef.current) cancelAnimationFrame(chargeRafRef.current); }, []);

                if (isEditing) {
                    return (
                        <div className="bg-[var(--bg-card)] rounded-2xl border border-indigo-500/50 p-5 flex flex-col gap-4 shadow-lg animate-in">
                            <div className="space-y-3">
                                <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono">論点名</label>
                                <input type="text" className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-3 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm" value={editForm.title} onChange={e => setEditForm({ ...editForm, title: e.target.value })} />

                                <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mt-2">タブ（科目）</label>
                                <select className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-3 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm" value={editForm.subject} onChange={e => setEditForm({ ...editForm, subject: e.target.value })}>
                                    {tabs.map(o => <option key={o.name} value={o.name}>{o.name}</option>)}
                                </select>

                                <div className="grid grid-cols-2 gap-3 mt-2">
                                    <div>
                                        <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mb-1">総復習回数</label>
                                        <input type="number" min="0" className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-3 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm mono-num" value={editForm.reviewCount} onChange={e => setEditForm({ ...editForm, reviewCount: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mb-1">最終復習日</label>
                                        <input type="datetime-local" className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-3 rounded-xl outline-none font-bold text-[var(--text-primary)] text-xs mono" value={editForm.lastStudiedAt} onChange={e => setEditForm({ ...editForm, lastStudiedAt: e.target.value })} />
                                    </div>
                                </div>
                            </div>
                            <div className="flex justify-end gap-2 mt-2">
                                <button type="button" onClick={() => setIsEditing(false)} className="px-4 py-2.5 text-xs font-bold text-[var(--text-tertiary)] hover:text-[var(--text-primary)] bg-[var(--bg-card-soft)] hover:bg-[var(--bg-card-soft-hover)] rounded-xl transition-colors">キャンセル</button>
                                <button type="button" onClick={handleSaveEdit} className="px-5 py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-lg transition-colors">保存する</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className={`relative rounded-2xl border p-5 flex flex-col gap-4 shadow-lg transition-colors overflow-hidden ${isNeedsReview ? 'border-red-500/50' : 'border-[var(--border-color)]'} ${isShaking ? 'card-impact-shake' : ''}`} style={{ backgroundColor: isNeedsReview ? 'var(--bg-danger-card)' : 'var(--bg-card)' }}>
                        {isNeedsReview && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.6)] z-10" />}
                        {isSweeping && (
                            <div key={sweepKey} className="review-fill-el">
                                <div className="review-fill-edge"></div>
                            </div>
                        )}
                        {popup && <div key={popup.id} className="recover-popup">{popup.text}</div>}

                        <div className="flex justify-between items-start">
                            <div className="flex-1 mr-4">
                                <div className="flex items-center gap-2 mb-1 flex-wrap">
                                    {isNeedsReview && <Icon name="AlertCircle" size={16} className="text-red-500 animate-pulse" />}
                                    <h3 className="text-base font-bold text-[var(--text-primary)] leading-tight">{t.title}</h3>
                                    <RankBadge rc={rc} />
                                    {isCustomInterval && <span className="text-[9px] font-black mono px-1.5 py-0.5 rounded-full border border-indigo-400/40 text-indigo-300 bg-indigo-500/10">個別</span>}
                                </div>
                                <p className="text-xs text-[var(--text-tertiary)] mono-num">復習回数: {rc} 回 ・ 最終復習: {new Date(t.lastStudiedAt).toLocaleDateString('ja-JP')}</p>
                            </div>
                            <div className="text-right">
                                <span className="text-[10px] font-bold text-[var(--text-tertiary)] block mono mb-1">定着率</span>
                                <span className={`text-2xl mono-num tracking-tighter ${isGood ? 'text-indigo-400' : isWarn ? 'text-yellow-400' : 'text-red-400'}`}>{Math.floor(ret)}%</span>
                            </div>
                        </div>

                        <div className="h-20 w-full relative bg-black/30 rounded-xl border border-[var(--border-color)] p-2 overflow-visible z-10">
                            <svg viewBox="0 0 200 50" className="w-full h-full overflow-visible">
                                <line x1="0" y1={50 - (REVIEW_THRESHOLD / 100) * 40} x2="200" y2={50 - (REVIEW_THRESHOLD / 100) * 40} stroke="#ef4444" strokeOpacity="0.3" strokeDasharray="4,4" strokeWidth="1" />
                                <polyline fill="none" stroke={isNeedsReview ? "#ef4444" : "#6366f1"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts} opacity={isNeedsReview ? "0.8" : "0.6"} />
                                <circle cx={(Math.min(hrs, targetHours) / targetHours) * 200} cy={50 - (ret / 100) * 40} r="4" fill={isGood ? '#818cf8' : isWarn ? '#facc15' : '#ef4444'} stroke="#000" strokeWidth="1.5" className="transition-all duration-300" />
                            </svg>
                            <div className="absolute bottom-1 left-2 right-2 flex justify-between text-[9px] mono text-[var(--text-muted)] font-bold"><span>0h</span><span>{targetHours / 24} days</span></div>
                        </div>

                        <div className="flex justify-between items-center mt-1 z-10">
                            <div className="flex gap-1 items-center">
                                <button type="button" onClick={() => handleAction('delete', t.id, { col: 'cpa_memory' })} className="text-[var(--text-muted)] hover:text-red-400 p-2 rounded-lg hover:bg-[var(--bg-card-soft)] transition-colors"><Icon name="Trash2" size={18} /></button>
                                <button type="button" onClick={() => setIsEditing(true)} className="text-[var(--text-muted)] hover:text-indigo-400 p-2 rounded-lg hover:bg-[var(--bg-card-soft)] transition-colors"><Icon name="Edit2" size={18} /></button>
                                <button type="button" onClick={() => setShowTopicSettings(true)} className={`p-2 rounded-lg hover:bg-[var(--bg-card-soft)] transition-colors ${isCustomInterval ? 'text-indigo-400' : 'text-[var(--text-muted)] hover:text-indigo-400'}`}><Icon name="Settings2" size={18} /></button>
                            </div>
                            <button
                                type="button"
                                onMouseDown={startCharge}
                                onMouseUp={endCharge}
                                onMouseLeave={endCharge}
                                onTouchStart={startCharge}
                                onTouchEnd={endCharge}
                                onTouchCancel={endCharge}
                                onContextMenu={(e) => e.preventDefault()}
                                className={`relative overflow-hidden font-bold mono py-2.5 px-5 rounded-xl shadow-lg transition-transform text-sm flex items-center gap-2 select-none touch-none ${isNeedsReview ? 'bg-red-600 text-white' : 'bg-indigo-600 text-white'} ${isCharging ? 'scale-95' : ''} ${isCharging && holdProgress >= 50 ? 'hold-shake' : ''}`}
                            >
                                <span className="hold-progress-fill" style={{ transform: `scaleX(${holdProgress / 100})`, transition: isCharging ? 'none' : 'transform 0.25s ease-out' }}></span>
                                <span className="relative flex items-center gap-2">
                                    <Icon name={isCharging ? "Droplets" : "Brain"} size={18} /> {isCharging ? 'ホールド中…' : '長押しで復習完了'}
                                </span>
                            </button>
                        </div>
                        {showTopicSettings && (
                            <TopicIntervalModal
                                topic={t}
                                globalIntervals={intervalDays}
                                onClose={() => setShowTopicSettings(false)}
                                onSave={(parsed, enabled) => {
                                    handleAction('update', t.id, { col: 'cpa_memory', updates: { customIntervals: enabled ? parsed : null } });
                                }}
                            />
                        )}
                    </div>
                );
            };

            const activeStat = activeSubject ? tabStats[activeSubject] : null;

            const GoalBar = ({ label, count, goal, icon }) => {
                const pct = Math.min(100, Math.round((count / goal) * 100));
                const done = pct >= 100;
                return (
                    <div>
                        <div className="flex justify-between items-center mb-1.5">
                            <span className="text-xs font-bold text-[var(--text-secondary)] flex items-center gap-1.5"><Icon name={icon} size={13} className="text-indigo-400" />{label}</span>
                            <span className="text-xs mono-num text-[var(--text-primary)]">{count} / {goal} 回 <span className={done ? 'text-indigo-400' : 'text-[var(--text-tertiary)]'}>({pct}%)</span></span>
                        </div>
                        <div className="w-full h-2.5 rounded-full bg-[var(--bg-card-soft)] overflow-hidden">
                            <div className={`h-full rounded-full transition-all duration-500 ${done ? 'bg-gradient-to-r from-amber-300 to-amber-500' : 'bg-gradient-to-r from-indigo-500 to-indigo-400'}`} style={{ width: `${pct}%` }}></div>
                        </div>
                    </div>
                );
            };

            const SettingsModal = () => {
                const [form, setForm] = useState(intervalDays.slice());
                const [saved, setSaved] = useState(false);

                useEffect(() => { setForm(intervalDays.slice()); }, [showSettings]);

                const updateField = (idx, val) => {
                    const next = form.slice();
                    next[idx] = val;
                    setForm(next);
                };

                const handleSave = () => {
                    const parsed = form.map(v => Math.max(0.1, parseFloat(v) || 0.1));
                    handleSaveIntervals(parsed);
                    setSaved(true);
                    setTimeout(() => setSaved(false), 1600);
                };

                const pyramidRows = RANKS.slice().reverse().map(r => {
                    const idx = RANKS.indexOf(r);
                    const widthPct = 100 - idx * 9.4; // idx=0(E)→100%（土台）、idx=7(SSS)→約34%（頂点）
                    const label = idx === RANKS.length - 1 ? `${idx}回以上` : `${idx}回`;
                    return { rank: r, idx, widthPct, label };
                });

                return (
                    <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center">
                        <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setShowSettings(false)}></div>
                        <div className="relative w-full sm:max-w-md max-h-[88vh] overflow-y-auto bg-[var(--bg-app-to)] border border-[var(--border-color)] rounded-t-3xl sm:rounded-3xl shadow-2xl animate-in">
                            <div className="sticky top-0 bg-[var(--bg-header)] backdrop-blur border-b border-[var(--border-color)] px-5 py-4 flex items-center justify-between z-10">
                                <h2 className="text-sm font-black text-[var(--text-primary)] flex items-center gap-2"><Icon name="Settings" size={16} className="text-indigo-400" />設定</h2>
                                <button type="button" onClick={() => setShowSettings(false)} className="h-8 w-8 flex items-center justify-center text-[var(--text-tertiary)] hover:text-[var(--text-primary)] bg-[var(--bg-card-soft)] rounded-full transition-colors active:scale-90">
                                    <Icon name="X" size={14} />
                                </button>
                            </div>

                            <div className="p-5 space-y-6">
                                <div className="bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-5 shadow-lg space-y-4">
                                    <div>
                                        <p className="text-xs font-black text-[var(--text-primary)] flex items-center gap-1.5"><Icon name="CalendarRange" size={14} className="text-indigo-400" />復習間隔のカスタマイズ（全体設定）</p>
                                        <p className="text-[10px] text-[var(--text-tertiary)] font-bold mt-1">各回の復習まで、それぞれ何日空けるかを設定できます（記憶定着ゲージの計算に反映されます）。「8回目以降」はそれ以降ずっと同じ間隔が適用されます。なお、論点ごとに個別設定（各カードの歯車アイコン）を行った場合は、そちらがこの全体設定より優先されます。</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        {form.map((d, idx) => (
                                            <div key={idx}>
                                                <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mb-1">{idx === form.length - 1 ? `${idx + 1}回目以降` : `${idx + 1}回目の間隔`}</label>
                                                <div className="relative">
                                                    <input
                                                        type="number" min="0.1" step="0.5"
                                                        className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-2.5 pr-9 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm mono-num"
                                                        value={d} onChange={e => updateField(idx, e.target.value)}
                                                    />
                                                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-[var(--text-muted)] mono">日後</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button type="button" onClick={handleSave} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition-colors flex items-center justify-center gap-1.5">
                                        <Icon name={saved ? "Check" : "Save"} size={14} />{saved ? '保存しました' : '保存する'}
                                    </button>
                                </div>

                                <div className="bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-5 shadow-lg space-y-4">
                                    <div>
                                        <p className="text-xs font-black text-[var(--text-primary)] flex items-center gap-1.5"><Icon name="Trophy" size={14} className="text-amber-400" />ランクアップ・ピラミッド</p>
                                        <p className="text-[10px] text-[var(--text-tertiary)] font-bold mt-1">頂点のSSSを目指して、復習を積み重ねましょう。</p>
                                    </div>
                                    <div className="flex flex-col items-center gap-1.5 pt-2 pb-1">
                                        {pyramidRows.map(row => (
                                            <div
                                                key={row.rank}
                                                style={{ width: `${row.widthPct}%` }}
                                                className={`flex items-center justify-between px-4 py-2.5 rounded-xl border transition-all ${RANK_STYLES[row.rank]}`}
                                            >
                                                <span className="font-black text-xs mono">{row.rank}</span>
                                                <span className="text-[10px] font-bold mono-num opacity-90">累計 {row.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const StatsView = () => {
                const { blue, warn, red, total, percentage } = overallStats;
                const color = percentage > 80 ? 'text-indigo-400' : percentage > REVIEW_THRESHOLD ? 'text-yellow-400' : 'text-red-400';
                const stroke = percentage > 80 ? '#818cf8' : percentage > REVIEW_THRESHOLD ? '#facc15' : '#ef4444';

                const recent = statsHistory.slice(-30);
                const n = recent.length;
                const graphPts = recent.map((h, i) => {
                    const x = n > 1 ? (i / (n - 1)) * 300 : 150;
                    const y = 110 - (Math.max(0, Math.min(100, h.percentage)) / 100) * 90;
                    return `${x},${y}`;
                }).join(' ');

                const isPerfect = percentage >= 100;
                return (
                    <div className="space-y-5">
                        <div className="bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-6 text-center shadow-lg">
                            <p className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono tracking-widest mb-2">全体の定着率（青の割合）</p>
                            <p className={`text-6xl mono-num tracking-tighter ${isPerfect ? 'perfect-glow' : color}`}>{percentage}<span className="text-2xl">%</span></p>
                            <p className="text-xs text-[var(--text-muted)] mt-2 mono-num">{blue} / {total} 論点が良好（青）</p>
                            <div className="flex justify-center gap-4 mt-4 text-xs mono-num font-bold">
                                <span className="flex items-center gap-1.5 text-indigo-400"><span className="w-2.5 h-2.5 rounded-full bg-indigo-400 shadow-[0_0_6px_rgba(129,140,248,0.6)]"></span>{blue}</span>
                                <span className="flex items-center gap-1.5 text-yellow-400"><span className="w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-[0_0_6px_rgba(250,204,21,0.6)]"></span>{warn}</span>
                                <span className="flex items-center gap-1.5 text-red-400"><span className="w-2.5 h-2.5 rounded-full bg-red-400 shadow-[0_0_6px_rgba(248,113,113,0.6)]"></span>{red}</span>
                            </div>
                        </div>

                        <div className="bg-gradient-to-b from-indigo-500/10 to-transparent border border-indigo-400/30 rounded-3xl p-6 text-center shadow-lg relative overflow-hidden">
                            <Icon name="Sparkles" size={16} className="text-indigo-400 mx-auto mb-1" />
                            <p className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono tracking-widest mb-1">今週の合計回復</p>
                            <p className="text-5xl mono-num tracking-tighter text-indigo-400">
                                <CountUpNumber value={weeklyRecovered} prefix="+" suffix="%" />
                            </p>
                        </div>

                        <div className="bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-5 shadow-lg space-y-4">
                            <div className="flex items-center justify-between">
                                <p className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono tracking-widest flex items-center gap-1.5"><Icon name="Target" size={13} className="text-indigo-400" />目標達成率</p>
                                <button type="button" onClick={() => setEditingGoals(v => !v)} className="text-[var(--text-muted)] hover:text-indigo-400 p-1.5 rounded-lg hover:bg-[var(--bg-card-soft)] transition-colors">
                                    <Icon name={editingGoals ? "X" : "Settings"} size={14} />
                                </button>
                            </div>

                            {editingGoals ? (
                                <div className="space-y-3 animate-in">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mb-1">週間目標（回）</label>
                                            <input type="number" min="1" className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-2.5 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm mono-num" value={goalForm.weekly} onChange={e => setGoalForm({ ...goalForm, weekly: e.target.value })} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono block mb-1">月間目標（回）</label>
                                            <input type="number" min="1" className="w-full bg-[var(--bg-input)] border border-[var(--border-strong)] p-2.5 rounded-xl outline-none font-bold text-[var(--text-primary)] text-sm mono-num" value={goalForm.monthly} onChange={e => setGoalForm({ ...goalForm, monthly: e.target.value })} />
                                        </div>
                                    </div>
                                    <button type="button" onClick={handleSaveGoals} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition-colors">保存する</button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <GoalBar label="今週" count={weeklyCount} goal={settings.weeklyGoal || 1} icon="CalendarDays" />
                                    <GoalBar label="今月" count={monthlyCount} goal={settings.monthlyGoal || 1} icon="Calendar" />
                                </div>
                            )}
                        </div>

                        {perSubjectGauge.length > 0 && (
                            <div className="bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-5 shadow-lg space-y-4">
                                <p className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono tracking-widest flex items-center gap-1.5"><Icon name="Gauge" size={13} className="text-indigo-400" />科目別 定着率ゲージ</p>
                                <div className="space-y-3">
                                    {perSubjectGauge.map(s => {
                                        const val = s.avg === null ? 0 : Math.round(s.avg);
                                        const gcolor = s.avg === null ? '#475569' : val > 80 ? '#818cf8' : val > REVIEW_THRESHOLD ? '#facc15' : '#ef4444';
                                        return (
                                            <div key={s.name}>
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-xs font-bold text-[var(--text-secondary)]">{s.name}</span>
                                                    <span className="text-xs mono-num text-[var(--text-primary)]">{s.avg === null ? '—' : `${val}%`}</span>
                                                </div>
                                                <div className="w-full h-2 rounded-full bg-[var(--bg-card-soft)] overflow-hidden">
                                                    <div className="h-full rounded-full transition-all duration-500" style={{ width: `${val}%`, backgroundColor: gcolor }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="bg-[var(--bg-card)] border border-[var(--border-color)] rounded-3xl p-5 shadow-lg">
                            <p className="text-[10px] text-[var(--text-tertiary)] font-bold uppercase mono tracking-widest mb-3">日別推移{n > 0 ? `（直近${n}日）` : ''}</p>
                            {n === 0 ? (
                                <div className="text-center py-14 text-[var(--text-muted)] text-xs font-bold">データがまだありません。<br />論点を追加・復習すると記録されます。</div>
                            ) : (
                                <div>
                                    <div className="relative h-40 w-full bg-black/20 rounded-xl border border-[var(--border-color)] p-2 overflow-visible">
                                        <svg viewBox="0 0 300 120" className="w-full h-full overflow-visible" preserveAspectRatio="none">
                                            <line x1="0" y1={110 - (REVIEW_THRESHOLD / 100) * 90} x2="300" y2={110 - (REVIEW_THRESHOLD / 100) * 90} stroke="#ef4444" strokeOpacity="0.25" strokeDasharray="4,4" strokeWidth="1" />
                                            <line x1="0" y1={110 - 0.8 * 90} x2="300" y2={110 - 0.8 * 90} stroke="#818cf8" strokeOpacity="0.2" strokeDasharray="4,4" strokeWidth="1" />
                                            {n > 1 && <polyline fill="none" stroke={stroke} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={graphPts} opacity="0.85" />}
                                            {recent.map((h, i) => {
                                                const x = n > 1 ? (i / (n - 1)) * 300 : 150;
                                                const y = 110 - (Math.max(0, Math.min(100, h.percentage)) / 100) * 90;
                                                const dotColor = h.percentage > 80 ? '#818cf8' : h.percentage > REVIEW_THRESHOLD ? '#facc15' : '#ef4444';
                                                return <circle key={h.id} cx={x} cy={y} r="3" fill={dotColor} stroke="#000" strokeWidth="1" />;
                                            })}
                                        </svg>
                                    </div>
                                    <div className="flex justify-between text-[9px] mono text-[var(--text-muted)] font-bold mt-2 px-1">
                                        <span>{recent[0]?.date}</span>
                                        <span>{recent[n - 1]?.date}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-12 bg-gradient-to-b from-[var(--bg-app-from)] to-[var(--bg-app-to)]">
                    {showSettings && <SettingsModal />}
                    <header className="bg-[var(--bg-header)] backdrop-blur border-b border-[var(--border-color)] px-4 pb-4 pt-safe shadow-2xl sticky top-0 z-50">
                        <div className="max-w-md mx-auto flex justify-between items-center mb-3 gap-2">
                            <h1 className="text-sm font-black text-[var(--text-primary)] tracking-widest flex items-center gap-2 min-w-0 truncate">
                                <Icon name="Brain" size={18} className="text-indigo-400 shrink-0" /> <span className="truncate">復習管理</span>
                            </h1>
                            <div className="flex items-center gap-1.5 shrink-0">
                                {(settings.currentStreak || 0) > 0 && (
                                    <span className="h-9 min-w-9 px-2.5 flex items-center justify-center gap-1 text-[10px] font-black mono-num text-orange-400 bg-orange-500/10 border border-orange-500/30 rounded-full">
                                        <Icon name="Flame" size={13} className="flame-pulse" />{settings.currentStreak}
                                    </span>
                                )}
                                <button type="button" onClick={handleToggleTheme} className="h-9 w-9 flex items-center justify-center text-[var(--text-tertiary)] hover:text-[var(--text-primary)] bg-[var(--bg-card-soft)] rounded-full transition-colors active:scale-90">
                                    <Icon name={settings.theme === 'light' ? 'Moon' : 'Sun'} size={14} />
                                </button>
                                <button type="button" onClick={() => setShowSettings(true)} className="h-9 w-9 flex items-center justify-center text-[var(--text-tertiary)] hover:text-[var(--text-primary)] bg-[var(--bg-card-soft)] rounded-full transition-colors active:scale-90">
                                    <Icon name="Settings" size={14} />
                                </button>
                                <button type="button" onClick={handleLogout} className="h-9 w-9 flex items-center justify-center text-xs font-bold text-[var(--text-tertiary)] hover:text-[var(--text-primary)] bg-[var(--bg-card-soft)] rounded-full transition-colors active:scale-95">
                                    <Icon name="LogOut" size={12} />
                                </button>
                            </div>
                        </div>

                        {view === 'review' && (<>
                        <div className="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar pb-1">
                            {tabs.map(tab => {
                                const stat = tabStats[tab.name] || { total: 0, needReview: 0 };
                                const active = tab.name === activeSubject;
                                return (
                                    <button
                                        type="button"
                                        key={tab.name}
                                        onClick={() => setActiveSubject(tab.name)}
                                        onContextMenu={(e) => { e.preventDefault(); handleDeleteSubject(tab); }}
                                        className={`relative shrink-0 flex items-center gap-1.5 px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap border ${
                                            active
                                                ? 'bg-indigo-600 text-white border-indigo-500 shadow-[0_0_16px_rgba(99,102,241,0.4)]'
                                                : stat.needReview > 0
                                                    ? 'bg-red-500/10 text-red-400 border-red-500/40'
                                                    : 'bg-[var(--bg-card-soft)] text-[var(--text-secondary)] border-[var(--border-color)] hover:bg-[var(--bg-card-soft-hover)]'
                                        }`}
                                    >
                                        {stat.needReview > 0 && <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>}
                                        {tab.name}
                                        <span className={`mono-num text-[10px] px-1.5 py-0.5 rounded-full ${active ? 'bg-white/20' : stat.needReview > 0 ? 'bg-red-500/20 text-red-400' : 'bg-[var(--bg-card-soft-hover)]'}`}>{stat.needReview}</span>
                                    </button>
                                );
                            })}
                            <button type="button" onClick={() => setShowAddSubject(v => !v)} className="shrink-0 flex items-center justify-center w-10 h-10 rounded-2xl bg-[var(--bg-card-soft)] hover:bg-[var(--bg-card-soft-hover)] border border-dashed border-[var(--border-strong)] text-[var(--text-secondary)] transition-colors">
                                <Icon name="Plus" size={18} />
                            </button>
                        </div>

                        {showAddSubject && (
                            <div className="max-w-md mx-auto flex gap-2 mt-2 animate-in">
                                <input
                                    type="text" autoFocus placeholder="新しいタブ名（例: 租税法）"
                                    className="flex-1 bg-[var(--bg-input)] border border-[var(--border-strong)] p-2.5 rounded-xl outline-none font-bold text-[var(--text-primary)] text-xs"
                                    value={newSubjectName} onChange={e => setNewSubjectName(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAddSubject(); }}
                                />
                                <button type="button" onClick={handleAddSubject} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-xl font-bold text-xs transition-colors">追加</button>
                                <button type="button" onClick={() => { setShowAddSubject(false); setNewSubjectName(''); }} className="bg-[var(--bg-card-soft)] hover:bg-[var(--bg-card-soft-hover)] text-[var(--text-tertiary)] px-3 rounded-xl transition-colors"><Icon name="X" size={16} /></button>
                            </div>
                        )}
                        </>)}
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-6 animate-in pb-28">
                        {view === 'review' ? (
                        <>
                        {tabs.length === 0 ? (
                            <div className="text-center py-16 text-[var(--text-tertiary)] text-sm font-bold border-2 border-dashed border-[var(--border-color)] rounded-3xl">タブを追加して論点を登録しましょう</div>
                        ) : (
                            <div className="space-y-3">
                                <div className="flex items-center justify-between px-1">
                                    <div className="flex items-center gap-2">
                                        <span className="text-sm font-bold text-[var(--text-primary)]">{activeSubject}</span>
                                        {activeStat && activeStat.needReview > 0 && (
                                            <span className="bg-red-500/20 text-red-400 text-xs mono-num font-bold px-2 py-0.5 rounded-full border border-red-500/30 flex items-center gap-1">
                                                <Icon name="AlertCircle" size={10} /> 要復習 {activeStat.needReview}
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="relative">
