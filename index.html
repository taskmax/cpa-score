<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>復習マネージャー</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, addDoc, deleteDoc, updateDoc, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHvv2J4RXuayFasYSNRB90poh0k7SEQ0w",
            authDomain: "study-app-57fe6.firebaseapp.com",
            projectId: "study-app-57fe6",
            storageBucket: "study-app-57fe6.firebasestorage.app",
            messagingSenderId: "648009305814",
            appId: "1:648009305814:web:e91f8744b14e13eed04377",
            measurementId: "G-9KT48YMGJB"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase not initialized", e);
        }

        const appId = 'score-chart-stable';
        window.fb = { auth, db, appId, collection, query, onSnapshot, addDoc, deleteDoc, updateDoc, setDoc, doc, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #cbd5e1; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .animate-in { animation: fadeIn 0.35s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }
        .pt-safe { padding-top: calc(env(safe-area-inset-top) + 14px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide && window.lucide.icons[name]) {
                    spanRef.current.innerHTML = '';
                    const iconNode = window.lucide.createElement(window.lucide.icons[name]);
                    iconNode.setAttribute('width', size);
                    iconNode.setAttribute('height', size);
                    iconNode.setAttribute('class', className);
                    spanRef.current.appendChild(iconNode);
                }
            }, [name, size, className]);
            return <span ref={spanRef} className={`inline-block ${className}`} />;
        };

        const DEFAULT_SUBJECTS = ['財務会計論(計算)', '財務会計論(理論)', '管理会計論', '企業法', '監査論'];
        const REVIEW_THRESHOLD = 65;

        // 1日(24h), 3日(72h), 7日(168h), 14日(336h), 30日(720h), 45日(1080h), 60日(1440h) 経過時に65%になるよう逆算した定数 (-時間 / ln(0.65))
        const S_VALUES = [
            55.7,   // 0回目復習後 (1日後に要復習)
            167.1,  // 1回目復習後 (3日後に要復習)
            389.9,  // 2回目復習後 (7日後に要復習)
            779.8,  // 3回目復習後 (14日後に要復習)
            1671.0, // 4回目復習後 (30日後に要復習)
            2506.6, // 5回目復習後 (45日後に要復習)
            3342.1  // 6回目以降 (常に60日後に要復習)
        ];

        const getMemoryRetention = (hours, reviewCount) => {
            if (hours <= 0) return 100;
            const s = S_VALUES[Math.min(reviewCount, S_VALUES.length - 1)];
            const rate = 100 * Math.exp(-hours / s);
            return Math.max(20, rate);
        };

        const getHoursSince = (isoString) => {
            if (!isoString) return 0;
            const d = new Date(isoString);
            return Math.max(0, (new Date() - d) / (1000 * 60 * 60));
        };

        const getNextIntervalHours = (reviewCount) => {
            const days = [1, 3, 7, 14, 30, 45, 60];
            return days[Math.min(reviewCount, days.length - 1)] * 24;
        };

        // datetime-local用フォーマット変換
        const toDatetimeLocalValue = (isoString) => {
            if (!isoString) return '';
            const d = new Date(isoString);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };
        const fromDatetimeLocalValue = (val) => {
            if (!val) return new Date().toISOString();
            return new Date(val).toISOString();
        };

        // ローカル日付キー (YYYY-MM-DD)
        const getLocalDateKey = (d = new Date()) => {
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [topics, setTopics] = useState([]);
            const [subjectsDb, setSubjectsDb] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [activeSubject, setActiveSubject] = useState(null);
            const [reorderMode, setReorderMode] = useState(false);
            const [showAddSubject, setShowAddSubject] = useState(false);
            const [newSubjectName, setNewSubjectName] = useState('');
            const [newTopicTitle, setNewTopicTitle] = useState('');
            const [view, setView] = useState('review');
            const [statsHistory, setStatsHistory] = useState([]);
            const seededRef = useRef(false);

            useEffect(() => {
                if (window.fb && window.fb.auth) {
                    return window.fb.onAuthStateChanged(window.fb.auth, (currentUser) => {
                        setUser(currentUser);
                        setLoading(false);
                    });
                } else {
                    setLoading(false);
                }
            }, []);

            const handleLogin = async () => {
                if (window.fb && window.fb.auth) {
                    const provider = new window.fb.GoogleAuthProvider();
                    try {
                        await window.fb.signInWithPopup(window.fb.auth, provider);
                    } catch (error) {
                        alert("ログインに失敗しました。");
                    }
                }
            };

            const handleLogout = async () => {
                if (window.fb && window.fb.auth) {
                    try { await window.fb.signOut(window.fb.auth); } catch (error) {}
                }
            };

            useEffect(() => {
                if (!user) { setTopics([]); setSubjectsDb([]); setStatsHistory([]); seededRef.current = false; return; }
                if (window.fb && window.fb.db) {
                    const { db, appId, collection, query, onSnapshot } = window.fb;
                    const unsubMemory = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory')), (snapshot) => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setTopics(data);
                    }, (err) => console.error("Fetch error:", err));

                    const unsubSubjects = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects')), (snapshot) => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setSubjectsDb(data);
                    }, (err) => console.error("Fetch error:", err));

                    const unsubStats = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_stats')), (snapshot) => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        data.sort((a, b) => (a.date > b.date ? 1 : -1));
                        setStatsHistory(data);
                    }, (err) => console.error("Fetch error:", err));

                    return () => { unsubMemory(); unsubSubjects(); unsubStats(); };
                }
            }, [user]);

            // 初回のみデフォルトタブを投入
            useEffect(() => {
                if (!user || seededRef.current) return;
                if (loading) return;
                if (subjectsDb.length === 0) {
                    seededRef.current = true;
                    (async () => {
                        const { db, appId, collection, addDoc } = window.fb;
                        for (let i = 0; i < DEFAULT_SUBJECTS.length; i++) {
                            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects'), {
                                name: DEFAULT_SUBJECTS[i],
                                order: i,
                                createdAt: new Date().toISOString()
                            });
                        }
                    })();
                } else {
                    seededRef.current = true;
                }
            }, [user, subjectsDb, loading]);

            // タブ一覧（DB登録済み + 既存トピックにのみ存在する未登録科目を統合）
            const tabs = useMemo(() => {
                const map = {};
                subjectsDb.forEach(s => { map[s.name] = { id: s.id, name: s.name, order: s.order ?? 0 }; });
                let extraIndex = 1000;
                topics.forEach(t => {
                    const name = t.subject || 'その他';
                    if (!map[name]) { map[name] = { id: null, name, order: extraIndex++ }; }
                });
                return Object.values(map).sort((a, b) => a.order - b.order);
            }, [subjectsDb, topics]);

            useEffect(() => {
                if (tabs.length === 0) { setActiveSubject(null); return; }
                if (!activeSubject || !tabs.find(t => t.name === activeSubject)) {
                    setActiveSubject(tabs[0].name);
                }
            }, [tabs, activeSubject]);

            const tabStats = useMemo(() => {
                const stats = {};
                tabs.forEach(t => { stats[t.name] = { total: 0, needReview: 0 }; });
                topics.forEach(t => {
                    const name = t.subject || 'その他';
                    if (!stats[name]) stats[name] = { total: 0, needReview: 0 };
                    stats[name].total += 1;
                    const hrs = getHoursSince(t.lastStudiedAt);
                    const ret = getMemoryRetention(hrs, t.reviewCount || 0);
                    if (ret <= REVIEW_THRESHOLD) stats[name].needReview += 1;
                });
                return stats;
            }, [tabs, topics]);

            const overallStats = useMemo(() => {
                let blue = 0, warn = 0, red = 0;
                topics.forEach(t => {
                    const hrs = getHoursSince(t.lastStudiedAt);
                    const ret = getMemoryRetention(hrs, t.reviewCount || 0);
                    if (ret > 80) blue++;
                    else if (ret > REVIEW_THRESHOLD) warn++;
                    else red++;
                });
                const total = topics.length;
                const percentage = total ? Math.round((blue / total) * 100) : 0;
                return { blue, warn, red, total, percentage };
            }, [topics]);

            // 毎日の定着率（青の割合）をスナップショットとして保存
            useEffect(() => {
                if (!user || !window.fb || !window.fb.db) return;
                if (topics.length === 0) return;
                const { db, appId, doc, setDoc } = window.fb;
                const dateKey = getLocalDateKey();
                setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_stats', dateKey), {
                    date: dateKey,
                    percentage: overallStats.percentage,
                    blue: overallStats.blue,
                    warn: overallStats.warn,
                    red: overallStats.red,
                    total: overallStats.total,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(err => console.error('Stats snapshot error:', err));
            }, [user, overallStats.percentage, overallStats.total]);

            const visibleTopics = useMemo(() => {
                if (!activeSubject) return [];
                return topics
                    .filter(t => (t.subject || 'その他') === activeSubject)
                    .slice()
                    .sort((a, b) => {
                        const oa = a.order ?? (a.createdAt ? new Date(a.createdAt).getTime() : 0);
                        const ob = b.order ?? (b.createdAt ? new Date(b.createdAt).getTime() : 0);
                        return oa - ob;
                    });
            }, [topics, activeSubject]);

            const handleAddTopic = async (e) => {
                e.preventDefault();
                if (!newTopicTitle.trim() || isSubmitting || !user || !activeSubject) return;
                setIsSubmitting(true);
                const newTopic = {
                    title: newTopicTitle.trim(),
                    subject: activeSubject,
                    lastStudiedAt: new Date().toISOString(),
                    reviewCount: 0,
                    createdAt: new Date().toISOString(),
                    order: Date.now()
                };
                try {
                    if (window.fb && window.fb.db) {
                        const { db, appId, collection, addDoc } = window.fb;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory'), newTopic);
                    }
                    setNewTopicTitle('');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleAddSubject = async () => {
                const name = newSubjectName.trim();
                if (!name || !user) return;
                if (tabs.find(t => t.name === name)) { alert('同名のタブが既に存在します。'); return; }
                const { db, appId, collection, addDoc } = window.fb;
                const maxOrder = tabs.reduce((m, t) => Math.max(m, t.order), -1);
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects'), {
                    name, order: maxOrder + 1, createdAt: new Date().toISOString()
                });
                setNewSubjectName('');
                setShowAddSubject(false);
            };

            const handleDeleteSubject = async (tab) => {
                if (tabs.length <= 1) { alert('最後のタブは削除できません。'); return; }
                if ((tabStats[tab.name]?.total || 0) > 0) { alert('このタブには論点が残っています。先に論点を移動または削除してください。'); return; }
                if (!tab.id) return;
                if (!window.confirm(`「${tab.name}」タブを削除しますか？`)) return;
                const { db, appId, doc, deleteDoc } = window.fb;
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_subjects', tab.id));
                if (activeSubject === tab.name) setActiveSubject(null);
            };

            const handleAction = async (action, id, data) => {
                if (!user) return;
                if (action === 'delete') {
                    if (!window.confirm("この論点を削除しますか？")) return;
                    const { db, doc, deleteDoc, appId } = window.fb;
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, data.col, id));
                }
                if (action === 'update') {
                    const { db, doc, updateDoc, appId } = window.fb;
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, data.col, id), data.updates);
                }
            };

            const handleReorder = async (topic, direction) => {
                const idx = visibleTopics.findIndex(t => t.id === topic.id);
                const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (swapIdx < 0 || swapIdx >= visibleTopics.length) return;
                const other = visibleTopics[swapIdx];
                const orderA = topic.order ?? Date.now();
                const orderB = other.order ?? Date.now();
                const { db, doc, updateDoc, appId } = window.fb;
                await Promise.all([
                    updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory', topic.id), { order: orderB }),
                    updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cpa_memory', other.id), { order: orderA })
                ]);
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-indigo-500 mono text-xs animate-pulse">LOADING...</div>;

            if (!user) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 space-y-8 pb-safe bg-gradient-to-b from-[#0a0a0f] to-black">
                        <div className="text-center space-y-4">
                            <Icon name="BrainCircuit" size={64} className="text-indigo-500 mx-auto" />
                            <h1 className="text-3xl font-black text-white tracking-wider">復習マネージャー</h1>
                            <p className="text-slate-400 text-sm font-bold">データはクラウドに安全に保存されます</p>
                        </div>
                        <button type="button" onClick={handleLogin} className="bg-white text-black hover:bg-slate-200 font-black py-4 px-8 rounded-2xl shadow-xl active:scale-[0.98] transition-all flex items-center gap-3 w-full max-w-sm justify-center">
                            <Icon name="LogIn" size={20} /> Googleでログイン
                        </button>
                    </div>
                );
            }

            const TopicCard = ({ t, idx, count }) => {
                const [isEditing, setIsEditing] = useState(false);
                const [editForm, setEditForm] = useState({
                    title: t.title,
                    subject: t.subject,
                    reviewCount: t.reviewCount || 0,
                    lastStudiedAt: toDatetimeLocalValue(t.lastStudiedAt)
                });

                const hrs = getHoursSince(t.lastStudiedAt);
                const rc = t.reviewCount || 0;
                const ret = getMemoryRetention(hrs, rc);

                const targetHours = getNextIntervalHours(rc);
                const GRAPH_STEPS = 80;
                const pts = Array.from({ length: GRAPH_STEPS + 1 }, (_, i) => {
                    const h = (i / GRAPH_STEPS) * targetHours;
                    return `${(h / targetHours) * 200},${50 - (getMemoryRetention(h, rc) / 100) * 40}`;
                }).join(' ');

                const isNeedsReview = ret <= REVIEW_THRESHOLD;
                const isWarn = ret <= 80 && !isNeedsReview;
                const isGood = ret > 80;

                const handleSaveEdit = () => {
                    if (!editForm.title.trim()) return;
                    handleAction('update', t.id, {
                        col: 'cpa_memory',
                        updates: {
                            title: editForm.title.trim(),
                            subject: editForm.subject,
                            reviewCount: Math.max(0, parseInt(editForm.reviewCount, 10) || 0),
                            lastStudiedAt: fromDatetimeLocalValue(editForm.lastStudiedAt)
                        }
                    });
                    setIsEditing(false);
                };

                const handleReview = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    handleAction('update', t.id, {
                        col: 'cpa_memory',
                        updates: {
                            lastStudiedAt: new Date().toISOString(),
                            reviewCount: rc + 1
                        }
                    });
                };

                if (isEditing) {
                    return (
                        <div className="bg-[#111] rounded-2xl border border-indigo-500/50 p-5 flex flex-col gap-4 shadow-lg animate-in">
                            <div className="space-y-3">
                                <label className="text-[10px] text-slate-400 font-bold uppercase mono">論点名</label>
                                <input type="text" className="w-full bg-black border border-white/20 p-3 rounded-xl outline-none font-bold text-white text-sm" value={editForm.title} onChange={e => setEditForm({ ...editForm, title: e.target.value })} />

                                <label className="text-[10px] text-slate-400 font-bold uppercase mono block mt-2">タブ（科目）</label>
                                <select className="w-full bg-black border border-white/20 p-3 rounded-xl outline-none font-bold text-white text-sm" value={editForm.subject} onChange={e => setEditForm({ ...editForm, subject: e.target.value })}>
                                    {tabs.map(o => <option key={o.name} value={o.name}>{o.name}</option>)}
                                </select>

                                <div className="grid grid-cols-2 gap-3 mt-2">
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase mono block mb-1">総復習回数</label>
                                        <input type="number" min="0" className="w-full bg-black border border-white/20 p-3 rounded-xl outline-none font-bold text-white text-sm mono" value={editForm.reviewCount} onChange={e => setEditForm({ ...editForm, reviewCount: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold uppercase mono block mb-1">最終復習日</label>
                                        <input type="datetime-local" className="w-full bg-black border border-white/20 p-3 rounded-xl outline-none font-bold text-white text-xs mono" value={editForm.lastStudiedAt} onChange={e => setEditForm({ ...editForm, lastStudiedAt: e.target.value })} />
                                    </div>
                                </div>
                            </div>
                            <div className="flex justify-end gap-2 mt-2">
                                <button type="button" onClick={() => setIsEditing(false)} className="px-4 py-2.5 text-xs font-bold text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-colors">キャンセル</button>
                                <button type="button" onClick={handleSaveEdit} className="px-5 py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-lg transition-colors">保存する</button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className={`relative rounded-2xl border p-5 flex flex-col gap-4 shadow-lg transition-colors overflow-hidden ${isNeedsReview ? 'bg-[#2a0808] border-red-500/50' : 'bg-[#111] border-white/10'}`}>
                        {isNeedsReview && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.6)]" />}
                        <div className="flex justify-between items-start">
                            <div className="flex-1 mr-4">
                                <div className="flex items-center gap-2 mb-1">
                                    {isNeedsReview && <Icon name="AlertCircle" size={16} className="text-red-500 animate-pulse" />}
                                    <h3 className="text-base font-bold text-white leading-tight">{t.title}</h3>
                                </div>
                                <p className="text-xs text-slate-400 mono">復習回数: {rc} 回 ・ 最終復習: {new Date(t.lastStudiedAt).toLocaleDateString('ja-JP')}</p>
                            </div>
                            <div className="text-right">
                                <span className="text-[10px] font-bold text-slate-400 block mono mb-1">定着率</span>
                                <span className={`text-2xl font-black mono tracking-tighter ${isGood ? 'text-indigo-400' : isWarn ? 'text-yellow-400' : 'text-red-400'}`}>{Math.floor(ret)}%</span>
                            </div>
                        </div>

                        <div className="h-20 w-full relative bg-black/50 rounded-xl border border-white/5 p-2 overflow-visible z-10">
                            <svg viewBox="0 0 200 50" className="w-full h-full overflow-visible">
                                <line x1="0" y1={50 - (REVIEW_THRESHOLD / 100) * 40} x2="200" y2={50 - (REVIEW_THRESHOLD / 100) * 40} stroke="#ef4444" strokeOpacity="0.3" strokeDasharray="4,4" strokeWidth="1" />
                                <polyline fill="none" stroke={isNeedsReview ? "#ef4444" : "#6366f1"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts} opacity={isNeedsReview ? "0.8" : "0.6"} />
                                <circle cx={(Math.min(hrs, targetHours) / targetHours) * 200} cy={50 - (ret / 100) * 40} r="4" fill={isGood ? '#818cf8' : isWarn ? '#facc15' : '#ef4444'} stroke="#000" strokeWidth="1.5" className="transition-all duration-300" />
                            </svg>
                            <div className="absolute bottom-1 left-2 right-2 flex justify-between text-[9px] mono text-slate-500 font-bold"><span>0h</span><span>{targetHours / 24} days</span></div>
                        </div>

                        <div className="flex justify-between items-center mt-1 z-10">
                            <div className="flex gap-1 items-center">
                                <button type="button" onClick={() => handleAction('delete', t.id, { col: 'cpa_memory' })} className="text-slate-500 hover:text-red-400 p-2 rounded-lg hover:bg-white/5 transition-colors"><Icon name="Trash2" size={18} /></button>
                                <button type="button" onClick={() => setIsEditing(true)} className="text-slate-500 hover:text-indigo-400 p-2 rounded-lg hover:bg-white/5 transition-colors"><Icon name="Edit2" size={18} /></button>
                                {reorderMode && (
                                    <div className="flex flex-col ml-1">
                                        <button type="button" disabled={idx === 0} onClick={() => handleReorder(t, 'up')} className="text-slate-500 hover:text-white disabled:opacity-20 disabled:pointer-events-none p-1 rounded-md hover:bg-white/5 transition-colors"><Icon name="ChevronUp" size={16} /></button>
                                        <button type="button" disabled={idx === count - 1} onClick={() => handleReorder(t, 'down')} className="text-slate-500 hover:text-white disabled:opacity-20 disabled:pointer-events-none p-1 rounded-md hover:bg-white/5 transition-colors"><Icon name="ChevronDown" size={16} /></button>
                                    </div>
                                )}
                            </div>
                            <button type="button" onClick={handleReview} className={`font-bold mono py-2.5 px-5 rounded-xl shadow-lg active:scale-95 transition-all text-sm flex items-center gap-2 ${isNeedsReview ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                                <Icon name="Brain" size={18} /> 復習した！
                            </button>
                        </div>
                    </div>
                );
            };

            const activeStat = activeSubject ? tabStats[activeSubject] : null;

            const StatsView = ({ stats, history }) => {
                const { blue, warn, red, total, percentage } = stats;
                const color = percentage > 80 ? 'text-indigo-400' : percentage > REVIEW_THRESHOLD ? 'text-yellow-400' : 'text-red-400';
                const stroke = percentage > 80 ? '#818cf8' : percentage > REVIEW_THRESHOLD ? '#facc15' : '#ef4444';

                const recent = history.slice(-30);
                const n = recent.length;
                const graphPts = recent.map((h, i) => {
                    const x = n > 1 ? (i / (n - 1)) * 300 : 150;
                    const y = 110 - (Math.max(0, Math.min(100, h.percentage)) / 100) * 90;
                    return `${x},${y}`;
                }).join(' ');

                return (
                    <div className="space-y-5">
                        <div className="bg-[#111] border border-white/10 rounded-3xl p-6 text-center shadow-lg">
                            <p className="text-[10px] text-slate-400 font-bold uppercase mono tracking-widest mb-2">全体の定着率（青の割合）</p>
                            <p className={`text-6xl font-black mono tracking-tighter ${color}`}>{percentage}<span className="text-2xl">%</span></p>
                            <p className="text-xs text-slate-500 mt-2 mono">{blue} / {total} 論点が良好（青）</p>
                            <div className="flex justify-center gap-4 mt-4 text-xs mono font-bold">
                                <span className="flex items-center gap-1.5 text-indigo-400"><span className="w-2.5 h-2.5 rounded-full bg-indigo-400 shadow-[0_0_6px_rgba(129,140,248,0.6)]"></span>{blue}</span>
                                <span className="flex items-center gap-1.5 text-yellow-400"><span className="w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-[0_0_6px_rgba(250,204,21,0.6)]"></span>{warn}</span>
                                <span className="flex items-center gap-1.5 text-red-400"><span className="w-2.5 h-2.5 rounded-full bg-red-400 shadow-[0_0_6px_rgba(248,113,113,0.6)]"></span>{red}</span>
                            </div>
                        </div>

                        <div className="bg-[#111] border border-white/10 rounded-3xl p-5 shadow-lg">
                            <p className="text-[10px] text-slate-400 font-bold uppercase mono tracking-widest mb-3">日別推移{n > 0 ? `（直近${n}日）` : ''}</p>
                            {n === 0 ? (
                                <div className="text-center py-14 text-slate-500 text-xs font-bold">データがまだありません。<br />論点を追加・復習すると記録されます。</div>
                            ) : (
                                <div>
                                    <div className="relative h-40 w-full bg-black/50 rounded-xl border border-white/5 p-2 overflow-visible">
                                        <svg viewBox="0 0 300 120" className="w-full h-full overflow-visible" preserveAspectRatio="none">
                                            <line x1="0" y1={110 - (REVIEW_THRESHOLD / 100) * 90} x2="300" y2={110 - (REVIEW_THRESHOLD / 100) * 90} stroke="#ef4444" strokeOpacity="0.25" strokeDasharray="4,4" strokeWidth="1" />
                                            <line x1="0" y1={110 - 0.8 * 90} x2="300" y2={110 - 0.8 * 90} stroke="#818cf8" strokeOpacity="0.2" strokeDasharray="4,4" strokeWidth="1" />
                                            {n > 1 && <polyline fill="none" stroke={stroke} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={graphPts} opacity="0.85" />}
                                            {recent.map((h, i) => {
                                                const x = n > 1 ? (i / (n - 1)) * 300 : 150;
                                                const y = 110 - (Math.max(0, Math.min(100, h.percentage)) / 100) * 90;
                                                const dotColor = h.percentage > 80 ? '#818cf8' : h.percentage > REVIEW_THRESHOLD ? '#facc15' : '#ef4444';
                                                return <circle key={h.id} cx={x} cy={y} r="3" fill={dotColor} stroke="#000" strokeWidth="1" />;
                                            })}
                                        </svg>
                                    </div>
                                    <div className="flex justify-between text-[9px] mono text-slate-500 font-bold mt-2 px-1">
                                        <span>{recent[0]?.date}</span>
                                        <span>{recent[n - 1]?.date}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-12 bg-gradient-to-b from-[#0a0a0f] to-black">
                    <header className="bg-black/95 backdrop-blur border-b border-white/10 px-4 pb-4 pt-safe shadow-2xl sticky top-0 z-50">
                        <div className="max-w-md mx-auto flex justify-between items-center mb-3 gap-3">
                            <h1 className="text-sm font-black text-white tracking-widest flex items-center gap-2 min-w-0 truncate">
                                <Icon name="BrainCircuit" size={18} className="text-indigo-400 shrink-0" /> <span className="truncate">復習マネージャー</span>
                            </h1>
                            <button type="button" onClick={handleLogout} className="shrink-0 text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 bg-white/5 px-3 py-1.5 rounded-full transition-colors active:scale-95">
                                <Icon name="LogOut" size={12} /> ログアウト
                            </button>
                        </div>

                        {view === 'review' && (<>
                        <div className="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar pb-1">
                            {tabs.map(tab => {
                                const stat = tabStats[tab.name] || { total: 0, needReview: 0 };
                                const active = tab.name === activeSubject;
                                return (
                                    <button
                                        type="button"
                                        key={tab.name}
                                        onClick={() => setActiveSubject(tab.name)}
                                        onContextMenu={(e) => { e.preventDefault(); handleDeleteSubject(tab); }}
                                        className={`relative shrink-0 flex items-center gap-1.5 px-4 py-2.5 rounded-2xl text-xs font-bold transition-all whitespace-nowrap border ${
                                            active
                                                ? 'bg-indigo-600 text-white border-indigo-500 shadow-[0_0_16px_rgba(99,102,241,0.4)]'
                                                : stat.needReview > 0
                                                    ? 'bg-red-500/10 text-red-300 border-red-500/40'
                                                    : 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/10'
                                        }`}
                                    >
                                        {stat.needReview > 0 && <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>}
                                        {tab.name}
                                        <span className={`mono text-[10px] px-1.5 py-0.5 rounded-full ${active ? 'bg-white/20' : stat.needReview > 0 ? 'bg-red-500/20 text-red-300' : 'bg-white/10'}`}>{stat.needReview}</span>
                                    </button>
                                );
                            })}
                            <button type="button" onClick={() => setShowAddSubject(v => !v)} className="shrink-0 flex items-center justify-center w-10 h-10 rounded-2xl bg-white/5 hover:bg-white/10 border border-dashed border-white/20 text-slate-300 transition-colors">
                                <Icon name="Plus" size={18} />
                            </button>
                        </div>

                        {showAddSubject && view === 'review' && (
                            <div className="max-w-md mx-auto flex gap-2 mt-2 animate-in">
                                <input
                                    type="text"
                                    autoFocus
                                    placeholder="新しいタブ名（例: 租税法）"
                                    className="flex-1 bg-black border border-white/20 p-2.5 rounded-xl outline-none font-bold text-white text-xs"
                                    value={newSubjectName}
                                    onChange={e => setNewSubjectName(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAddSubject(); }}
                                />
                                <button type="button" onClick={handleAddSubject} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-xl font-bold text-xs transition-colors">追加</button>
                                <button type="button" onClick={() => { setShowAddSubject(false); setNewSubjectName(''); }} className="bg-white/5 hover:bg-white/10 text-slate-400 px-3 rounded-xl transition-colors"><Icon name="X" size={16} /></button>
                            </div>
                        )}
                        </>)}
                    </header>

                    <main className="max-w-md mx-auto p-4 space-y-6 animate-in pb-28">
                        {view === 'review' ? (
                        <>
                        <form onSubmit={handleAddTopic} className="bg-[#111] p-5 rounded-3xl border border-white/10 flex flex-col gap-3 shadow-lg">
                            <label className="text-xs font-black text-white uppercase mono tracking-widest ml-1 flex items-center gap-2">
                                <Icon name="FolderTree" size={14} className="text-indigo-400" /> {activeSubject || '—'} に論点を追加
                            </label>
                            <div className="flex gap-2">
                                <input type="text" placeholder="例: 有価証券、リース" className="flex-1 bg-black border border-white/20 p-4 rounded-xl outline-none font-bold text-white text-base" value={newTopicTitle} onChange={e => setNewTopicTitle(e.target.value)} required />
                                <button type="submit" disabled={isSubmitting || !activeSubject} className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white px-5 rounded-xl font-bold flex items-center justify-center transition-colors"><Icon name="Plus" size={24} /></button>
                            </div>
                        </form>

                        {tabs.length === 0 ? (
                            <div className="text-center py-16 text-slate-400 text-sm font-bold border-2 border-dashed border-white/10 rounded-3xl">タブを追加して論点を登録しましょう</div>
                        ) : (
                            <div className="space-y-3">
                                <div className="flex items-center justify-between px-1">
                                    <div className="flex items-center gap-2">
                                        <span className="text-sm font-bold text-white">{activeSubject}</span>
                                        {activeStat && activeStat.needReview > 0 && (
                                            <span className="bg-red-500/20 text-red-400 text-xs mono font-bold px-2 py-0.5 rounded-full border border-red-500/30 flex items-center gap-1">
                                                <Icon name="AlertCircle" size={10} /> 要復習 {activeStat.needReview}
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button type="button" onClick={() => setReorderMode(v => !v)} className={`text-xs font-bold flex items-center gap-1 px-3 py-1.5 rounded-full transition-colors ${reorderMode ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400 hover:bg-white/10'}`}>
                                            <Icon name="ArrowUpDown" size={12} /> 並び替え
                                        </button>
                                        {tabs.find(t => t.name === activeSubject)?.id && (
                                            <button type="button" onClick={() => handleDeleteSubject(tabs.find(t => t.name === activeSubject))} className="text-xs font-bold flex items-center gap-1 px-2.5 py-1.5 rounded-full bg-white/5 text-slate-500 hover:text-red-400 hover:bg-white/10 transition-colors">
                                                <Icon name="Trash2" size={12} />
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {visibleTopics.length === 0 ? (
                                    <div className="text-center py-16 text-slate-400 text-sm font-bold border-2 border-dashed border-white/10 rounded-3xl">論点を登録して記憶をトラッキングしましょう</div>
                                ) : (
                                    <div className="space-y-4">
                                        {visibleTopics.map((t, i) => <TopicCard key={t.id} t={t} idx={i} count={visibleTopics.length} />)}
                                    </div>
                                )}
                            </div>
                        )}
                        </>
                        ) : (
                            <StatsView stats={overallStats} history={statsHistory} />
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur border-t border-white/10 pb-safe">
                        <div className="max-w-md mx-auto grid grid-cols-2 gap-2 p-3">
                            <button type="button" onClick={() => setView('review')} className={`flex flex-col items-center gap-1 py-2 rounded-2xl text-xs font-bold transition-colors ${view === 'review' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-white/5'}`}>
                                <Icon name="Brain" size={20} />
                                復習
                            </button>
                            <button type="button" onClick={() => setView('stats')} className={`flex flex-col items-center gap-1 py-2 rounded-2xl text-xs font-bold transition-colors ${view === 'stats' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-white/5'}`}>
                                <Icon name="LineChart" size={20} />
                                グラフ
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
