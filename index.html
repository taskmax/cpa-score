<p className="text-[10px] text-[var(--text-tertiary)] font-bold px-1 flex items-center gap-1.5"><Icon name="Info" size={11} />右のハンドルをドラッグして並び替え、○をタップして選択できます</p>
<div className="space-y-2.5">
{editList.map((t) => (
<EditableTopicRow
key={t.id}
t={t}
intervalDays={intervalDays}
dragging={dragging}
isSelected={selectedIds.has(t.id)}
onToggleSelect={toggleSelected}
onDelete={handleDeleteTopic}
onUpdateCustomIntervals={handleUpdateTopicCustomIntervals}
onDragStart={handleDragPointerDown}
onDragMove={handleDragPointerMove}
onDragEnd={handleDragPointerUp}
registerRowRef={registerRowRef}
/>
))}
</div>
</>
)
) : (
visibleTopics.length === 0 ? (
<div className="text-center py-16 text-[var(--text-tertiary)] text-sm font-bold border-2 border-dashed border-[var(--border-color)] rounded-3xl">論点を登録して記憶をトラッキングしましょう</div>
) : (
<div className="space-y-4">
{visibleTopics.map((t) => <TopicCard key={t.id} t={t} onReview={handleReviewAction} onAnimStart={handleAnimStart} onAnimEnd={handleAnimEnd} tabs={tabs} intervalDays={intervalDays} onUpdate={handleUpdateTopic} />)}
</div>
)
)}
</div>
)}
{}
{!editMode && (
<form onSubmit={handleAddTopic} className="bg-[var(--bg-card)] p-5 rounded-3xl border border-[var(--border-color)] flex flex-col gap-3 shadow-lg">
<label className="text-xs font-black text-[var(--text-primary)] uppercase mono tracking-widest ml-1 flex items-center gap-2">
<Icon name="FolderTree" size={14} className="text-indigo-400" /> {activeSubject || '—'} に論点を追加
</label>
<div className="flex gap-2">
<input type="text" placeholder="例: 有価証券、リース" className="flex-1 bg-[var(--bg-input)] border border-[var(--border-strong)] p-4 rounded-xl outline-none font-bold text-[var(--text-primary)] text-base" value={newTopicTitle} onChange={e => setNewTopicTitle(e.target.value)} required />
<button type="submit" disabled={isSubmitting || !activeSubject} className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white px-5 rounded-xl font-bold flex items-center justify-center transition-colors"><Icon name="Plus" size={24} /></button>
</div>
</form>
)}
</>
) : (
<StatsView
overallStats={overallStats}
statsHistory={statsHistory}
weeklyRecovered={weeklyRecovered}
perSubjectGauge={perSubjectGauge}
topics={topics}
intervalDays={intervalDays}
subjectRanking={subjectRanking}
/>
)}
</main>
{editMode ? (
<div className="fixed bottom-0 left-0 right-0 z-[60] bg-[var(--bg-header)] backdrop-blur border-t border-[var(--border-color)] pb-safe animate-in">
<div className="max-w-md mx-auto flex items-center justify-between gap-2 p-3">
<button type="button" onClick={handleSelectAllToggle} className="text-xs font-bold flex items-center gap-1.5 px-3 py-2 rounded-xl bg-[var(--bg-card-soft)] text-[var(--text-secondary)] hover:bg-[var(--bg-card-soft-hover)] transition-colors shrink-0">
<Icon name={selectedIds.size === editList.length && editList.length > 0 ? "CheckSquare" : "Square"} size={14} />
全選択
</button>
<span className="text-xs font-bold mono-num text-[var(--text-tertiary)] shrink-0">{selectedIds.size}件選択中</span>
<div className="flex items-center gap-2 shrink-0">
<button
type="button"
onClick={() => { playTapSound(); setBulkCountValue('0'); setShowBulkCountModal(true); }}
disabled={selectedIds.size === 0}
className="text-xs font-bold flex items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 text-white transition-colors whitespace-nowrap"
>
<Icon name="Hash" size={14} />
復習回数を設定
</button>
<button
type="button"
onClick={handleBulkDelete}
disabled={selectedIds.size === 0 || isBulkDeleting}
className="text-xs font-bold flex items-center gap-1.5 px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 disabled:opacity-30 text-white transition-colors"
>
<Icon name="Trash2" size={14} />
削除
</button>
</div>
</div>
</div>
) : (
<nav className="fixed bottom-0 left-0 right-0 z-50 bg-[var(--bg-header)] backdrop-blur border-t border-[var(--border-color)] pb-safe">
<div className="max-w-md mx-auto grid grid-cols-2 gap-2 p-3">
<button type="button" onClick={() => handleNavTap('review')} className={`flex flex-col items-center gap-1 py-2 rounded-2xl text-xs font-bold transition-colors ${view === 'review' ? 'bg-indigo-600 text-white' : 'text-[var(--text-tertiary)] hover:bg-[var(--bg-card-soft)]'}`}>
<Icon name="Brain" size={20} />
復習
</button>
<button type="button" onClick={() => handleNavTap('stats')} className={`flex flex-col items-center gap-1 py-2 rounded-2xl text-xs font-bold transition-colors ${view === 'stats' ? 'bg-indigo-600 text-white' : 'text-[var(--text-tertiary)] hover:bg-[var(--bg-card-soft)]'}`}>
<Icon name="LineChart" size={20} />
統計
</button>
</div>
</nav>
)}
</div>
);
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);</script>
</body>
</html>
